async function loadComments(id){let{data,error}=await sb.from("comments").select(`*,author:profiles!comments_author_id_fkey(id,username,display_name,avatar_emoji)`).eq("post_id",id).order("created_at",{ascending:true}).limit(100);if(error){let f=await sb.from("comments").select("*").eq("post_id",id).order("created_at",{ascending:true}).limit(100);data=await enrichComments(f.data||[])}S.comments[id]=data||[];render()}
async function enrichComments(a){let ids=[...new Set(a.map(x=>x.author_id).filter(Boolean))];if(!ids.length)return a;let{data}=await sb.from("profiles").select("id,username,display_name,avatar_emoji").in("id",ids),m=new Map((data||[]).map(x=>[x.id,x]));return a.map(x=>({...x,author:m.get(x.author_id)||null}))}
function commentsHTML(id){if(!S.commentOpen[id])return"";if(!S.comments[id]){loadComments(id);return`<div class="comments"><form class="comment-form" onsubmit="event.preventDefault();sendComment('${esc(id)}')"><input id="ci-${esc(id)}" class="comment-input" maxlength="500" placeholder="Write a comment..."><button class="primary">Send</button></form><div class="comment-empty">Loading comments...</div></div>`}let a=S.comments[id];return`<div class="comments"><form class="comment-form" onsubmit="event.preventDefault();sendComment('${esc(id)}')"><input id="ci-${esc(id)}" class="comment-input" maxlength="500" placeholder="Write a comment..."><button class="primary">Send</button></form>${a.length?`<div class="comment-list">${a.map(c=>`<div class="comment"><div class="avatar">${esc(c.author?.avatar_emoji||"🙂")}</div><div class="comment-text"><div class="comment-meta"><b>${esc(c.author?.display_name||c.author?.username||"User")}</b><span>@${esc(c.author?.username||"")} · ${esc(time(c.created_at))}</span></div><div class="comment-body">${esc(c.body)}</div></div></div>`).join("")}</div>`:`<div class="comment-empty">No comments yet. Start the conversation.</div>`}</div>`}
async function sendComment(id){let i=document.getElementById("ci-"+id),b=i?.value.trim();if(!b)return;let{error}=await sb.from("comments").insert({post_id:id,author_id:S.user.id,body:b});if(error)toast(error.message);else{S.commentOpen[id]=true;S.comments[id]=null;toast("Comment added");render()}}
function toggleComments(id){S.commentOpen[id]=!S.commentOpen[id];render()}
async function delPost(id){if(!confirm("Delete this post?"))return;let{error}=await sb.from("posts").delete().eq("id",id).eq("author_id",S.user.id);if(error)toast(error.message);else{toast("Post deleted");refresh()}}
async function share(p){let u=location.origin+location.pathname+"#/post/"+encodeURIComponent(p.id);try{if(navigator.share)await navigator.share({title:"NICHE",text:p.body,url:u});else await navigator.clipboard.writeText(u),toast("Post link copied.")}catch{}}
function bodyHTML(text){let out="",last=0,re=/#([a-zA-Z0-9_-]+)/g,m;while((m=re.exec(text))){out+=esc(text.slice(last,m.index));let t=topic(m[1]);out+=`<a class="hashtag" href="${hrefN(t)}" onclick="event.preventDefault();nav('/niche/${encodeURIComponent(t)}')">#${esc(t)}</a>`;last=m.index+m[0].length}return(out+esc(text.slice(last))).replace(/\n/g,"<br>")}
function postHTML(p){let a=p.author||{},dn=a.display_name||a.username||"User",hn=a.username?"@"+a.username:"",lc=p.like_count??p.likes?.length??0,rc=p.repost_count??p.reposts?.length??0,cc=p.comment_count??S.comments[p.id]?.length??0;return`<article class="post" id="post-${esc(p.id)}"><div class="post-row"><a class="avatar" href="${a.username?hrefP(a.username):"#"}">${esc(a.avatar_emoji||"🙂")}</a><div class="post-main"><div class="head"><a class="name" href="${a.username?hrefP(a.username):"#"}">${esc(dn)}</a>${hn?`<a class="handle" href="${hrefP(a.username)}">${esc(hn)}</a>`:""}<span class="dot">·</span><span class="time">${esc(time(p.created_at))}</span></div><div class="body">${bodyHTML(p.body)}</div>${p.hashtag?`<a class="posttag" href="${hrefN(p.hashtag)}" onclick="event.preventDefault();nav('/niche/${encodeURIComponent(topic(p.hashtag))}')">#${esc(topic(p.hashtag))}</a>`:""}<div class="actions"><button class="action" onclick="toggleComments('${esc(p.id)}')">💬 ${cc}</button><button class="action ${reposted(p)?"reposted":""}" onclick="repost('${esc(p.id)}')">↻ ${rc}</button><button class="action ${liked(p)?"liked":""}" onclick="like('${esc(p.id)}')">${liked(p)?"♥":"♡"} ${lc}</button><button class="action" onclick='share(${JSON.stringify(p).replace(/'/g,"&#039;")})'>↗</button>${S.user.id===p.author_id?`<button class="action" onclick="delPost('${esc(p.id)}')">×</button>`:""}</div>${commentsHTML(p.id)}</div></div></article>`}
function composer(){return`<section class="composer"><div class="avatar">${esc(S.profile?.avatar_emoji||"🙂")}</div><div class="composer-main"><textarea id="composer" maxlength="500" placeholder="What's happening in your niche?" oninput="preview()"></textarea><div class="composer-foot"><div id="tags" class="tags"><span style="color:var(--muted);font-size:12px">Add #topic</span></div><span id="count" class="count">0/500</span><button id="postbtn" class="primary" disabled onclick="createPost()">Post</button></div></div></section>`}
async function loadNiche(t){S.niche=null;let{data}=await sb.from("niches").select("*").eq("slug",topic(t)).maybeSingle();if(data)S.niche=data;else{let{data:p}=await sb.from("posts").select("id,hashtag").eq("hashtag",topic(t)).limit(1);if(p?.length)S.niche={id:null,slug:topic(t),name:topic(t),post_count:0,follower_count:0,virtual:true}}}
async function follow(){if(!S.niche?.id)return toast("This niche is not registered yet.");let q=S.following?sb.from("niche_followers").delete().eq("niche_id",S.niche.id).eq("user_id",S.user.id):sb.from("niche_followers").insert({niche_id:S.niche.id,user_id:S.user.id});let{error}=await q;if(error)toast(error.message);else{S.following=!S.following;render()}}
async function loadFollow(){if(!S.niche?.id){S.following=false;return}let{data}=await sb.from("niche_followers").select("user_id").eq("niche_id",S.niche.id).eq("user_id",S.user.id).maybeSingle();S.following=!!data}
async function loadPublicProfile(u){let{data}=await sb.from("profiles").select("*").eq("username",u).maybeSingle();S.publicProfile=data}
async function profilePosts(id){let{data}=await sb.from("posts").select(`*,author:profiles!posts_author_id_fkey(id,username,display_name,avatar_emoji,bio),likes(user_id),reposts(user_id)`).eq("author_id",id).order("created_at",{ascending:false}).limit(50);return data||[]}
function home(){return`${composer()}${S.loading?`<div class="loading">Loading feed...</div>`:S.posts.length?S.posts.map(postHTML).join(""):`<div class="empty"><div class="icon">🌱</div><h2>Your feed is empty</h2><p>Create the first post and give a topic somewhere to start.</p></div>`}`}
function nichePage(){if(!S.niche)return`<div class="empty"><div class="icon">🔎</div><h2>Niche not found</h2><p>No posts or registered niche match this topic.</p><button class="primary" style="margin-top:18px" onclick="nav('/')">Go home</button></div>`;let n=S.niche;return`<header class="header"><button class="back" onclick="nav('/')">← Home</button><div class="title-row"><div><h1 class="title">#${esc(n.name||n.slug)}</h1><div class="sub">Topic · #${esc(n.slug)}</div>${n.description?`<div class="desc">${esc(n.description)}</div>`:""}<div class="stats"><span><b>${esc(n.post_count??S.posts.length)}</b> posts</span><span><b>${esc(n.follower_count??0)}</b> followers</span></div></div>${n.id?`<button class="secondary" onclick="follow()">${S.following?"Following":"Follow"}</button>`:""}</div></header>${S.loading?`<div class="loading">Loading niche...</div>`:S.posts.length?S.posts.map(postHTML).join(""):`<div class="empty"><div class="icon">🌱</div><h2>No posts yet</h2><p>Be the first person to post here.</p></div>`}`}
function profilePage(){let p=S.publicProfile;if(!p)return`<div class="empty"><div class="icon">👤</div><h2>Profile not found</h2><p>That username does not exist.</p><button class="primary" style="margin-top:18px" onclick="nav('/')">Go home</button></div>`;return`<header class="header"><button class="back" onclick="nav('/')">← Home</button><div class="profile-head"><div class="avatar big">${esc(p.avatar_emoji||"🙂")}</div><div class="profile-info"><div class="profile-name">${esc(p.display_name||p.username)}</div><div class="profile-handle">@${esc(p.username)}</div>${p.bio?`<div class="bio">${esc(p.bio)}</div>`:""}<div class="stats"><span><b>${S.posts.length}</b> posts</span></div></div></div></header>${S.posts.length?S.posts.map(postHTML).join(""):`<div class="empty"><div class="icon">✦</div><h2>No posts yet</h2><p>This profile has not posted anything yet.</p></div>`}`}
async function exploreSearch(v){S.search=v;let q=v.trim().replace(/^#/,'').replace(/^@/,'').toLowerCase();if(!q){S.results=[];render();return}let[n,p]=await Promise.all([sb.from("niches").select("*").ilike("slug",`%${q}%`).limit(20),sb.from("profiles").select("id,username,display_name,avatar_emoji,bio").ilike("username",`%${q}%`).limit(20)]);S.results=[...(n.data||[]).map(x=>({t:"n",x})),...(p.data||[]).map(x=>({t:"p",x}))];render()}
function explore(){return`<section class="explore"><h1>Explore</h1><p style="color:var(--muted);font-size:12px">Search for niches or people.</p><input class="search" style="border:1px solid var(--border);background:var(--surface)" placeholder="Search #football or @username" value="${esc(S.search)}" onkeydown="if(event.key==='Enter')exploreSearch(this.value)"></section>${S.search?`<div class="results">${S.results.length?S.results.map(r=>r.t==='n'?`<a class="result" href="${hrefN(r.x.slug)}" onclick="event.preventDefault();nav('/niche/${encodeURIComponent(r.x.slug)}')"><b>#${esc(r.x.name||r.x.slug)}</b><small>Niche · ${esc(r.x.post_count||0)} posts</small></a>`:`<a class="result" href="${hrefP(r.x.username)}" onclick="event.preventDefault();nav('/profile/${encodeURIComponent(r.x.username)}')"><b>${esc(r.x.display_name||r.x.username)}</b><small>@${esc(r.x.username)}</small></a>`).join(""):`<div class="empty"><div class="icon">🔎</div><h2>No results</h2><p>Try another topic or username.</p></div>`}</div>`:`<div class="empty"><div class="icon">⌕</div><h2>Find your next niche</h2><p>Search above for topics and people.</p></div>`}`}
function settings(){return`<div class="settings"><section class="setting-section"><h1>Appearance</h1><p>Dark, System, and Light are independent theme modes.</p><div class="themes">${[["dark","Dark"],["system","System"],["light","Light"]].map(x=>`<button class="themeopt ${S.theme===x[0]?"active":""}" onclick="setTheme('${x[0]}')">${x[1]}</button>`).join("")}</div></section><section class="setting-section"><h1>Account</h1><p>Signed in as ${esc(S.user?.email||"")}</p><button class="danger" onclick="sb.auth.signOut()">Log out</button></section></div>`}
function layout(content){let p=S.profile||{};return`<div class="shell"><aside class="side"><a class="brand" href="#/" onclick="event.preventDefault();nav('/')"><b>NICHE</b><span>Everything starts with a topic.</span></a><nav class="nav"><button onclick="nav('/')"><i>⌂</i>Home</button><button onclick="nav('/explore')"><i>⌕</i>Explore</button><button onclick="nav('/profile/${encodeURIComponent(p.username||'')}')"><i>◯</i>Profile</button><button onclick="nav('/settings')"><i>⚙</i>Settings</button></nav><div class="mini"><div class="avatar">${esc(p.avatar_emoji||"🙂")}</div><div class="txt"><strong>${esc(p.display_name||p.username||"User")}</strong><small>@${esc(p.username||"")}</small></div></div><div class="mini-actions"><button class="linkbtn" onclick="nav('/profile/${encodeURIComponent(p.username||'')}')">Profile</button><button class="linkbtn" onclick="sb.auth.signOut()">Log out</button></div></aside><main class="main"><header class="top"><a class="mobile-brand" href="#/" onclick="event.preventDefault();nav('/')">NICHE</a><div class="searchbox"><input id="topsearch" class="search" placeholder="Search niches..." value="${esc(S.search)}" onkeydown="if(event.key==='Enter'){let x=topic(this.value);if(x)nav('/niche/'+encodeURIComponent(x))}"></div><button class="theme" onclick="cycleTheme()" title="Change theme">${S.theme==='dark'?'☾':S.theme==='light'?'☀':'◐'}</button></header>${content}</main><aside class="right"><div class="card"><h3>Welcome to NICHE</h3><p>Follow topics, join conversations, and share what matters to you.</p></div><div class="card"><h3>How it works</h3><p>Every post belongs to a niche. Add a hashtag such as <b>#football</b> to enter that topic.</p></div><div class="card"><h3>GitHub Pages safe</h3><p>Niche pages use hash routing, so clicking #football stays inside NICHE instead of opening a server 404.</p></div></aside></div>`}
async function refresh(){let r=route();if(r.type==='niche'){await loadNiche(r.topic);await loadFollow();await loadPosts()}else if(r.type==='profile'){await loadPublicProfile(r.username);S.posts=S.publicProfile?await profilePosts(S.publicProfile.id):[]}else{S.niche=null;S.publicProfile=null;await loadPosts()}render()}
async function render(){applyTheme();if(!S.session){renderAuth();return}if(needSetup()){renderSetup();return}let r=route();if(r.type==='niche'){S.search='#'+r.topic;await loadNiche(r.topic);await loadFollow();await loadPosts();document.getElementById('app').innerHTML=layout(nichePage())}else if(r.type==='profile'){S.search='';await loadPublicProfile(r.username);S.posts=S.publicProfile?await profilePosts(S.publicProfile.id):[];document.getElementById('app').innerHTML=layout(profilePage())}else if(r.type==='explore'){document.getElementById('app').innerHTML=layout(explore())}else if(r.type==='settings'){document.getElementById('app').innerHTML=layout(settings())}else if(r.type==='post'){await loadPosts();document.getElementById('app').innerHTML=layout(home());setTimeout(()=>document.getElementById('post-'+CSS.escape(r.id))?.scrollIntoView({behavior:'smooth',block:'center'}),50)}else{S.search='';S.niche=null;S.publicProfile=null;await loadPosts();document.getElementById('app').innerHTML=layout(home())}}
async function init(){applyTheme();let{data}=await sb.auth.getSession();S.session=data.session;S.user=data.session?.user||null;if(S.user)await loadProfile();await render();sb.auth.onAuthStateChange(async(_e,session)=>{S.session=session;S.user=session?.user||null;if(S.user)await loadProfile();else S.profile=null;await render()});sb.channel('niche-v2').on('postgres_changes',{event:'*',schema:'public',table:'posts'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'likes'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'reposts'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'comments'},refresh).subscribe()}
init();
</script></body></html>
