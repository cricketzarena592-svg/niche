<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <title>NICHE — Everything starts with a topic</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       NICHE v2
       ========================================================= */

    :root {
      color-scheme: light;

      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f6f6f6;
      --surface-3: #eeeeee;

      --text: #111111;
      --muted: #737373;
      --faint: #a3a3a3;

      --border: #e5e5e5;

      --accent: #111111;
      --accent-text: #ffffff;

      --blue: #2563eb;
      --red: #ef4444;
      --green: #16a34a;

      --danger-bg: #fef2f2;
      --danger-text: #dc2626;

      --shadow:
        0 12px 40px rgba(0, 0, 0, .08);

      --topbar-bg:
        rgba(255, 255, 255, .88);
    }

    html.dark {
      color-scheme: dark;

      --bg: #0b0b0c;
      --surface: #101011;
      --surface-2: #181819;
      --surface-3: #222224;

      --text: #f5f5f5;
      --muted: #99999f;
      --faint: #707076;

      --border: #29292d;

      --accent: #f5f5f5;
      --accent-text: #0b0b0c;

      --blue: #60a5fa;
      --red: #f87171;
      --green: #4ade80;

      --danger-bg: #2a1517;
      --danger-text: #f87171;

      --shadow:
        0 12px 40px rgba(0, 0, 0, .35);

      --topbar-bg:
        rgba(11, 11, 12, .88);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition:
        background .2s,
        color .2s;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }

    ::selection {
      background: var(--text);
      color: var(--bg);
    }

    /* =========================================================
       GENERAL
       ========================================================= */

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .app-shell {
      min-height: 100vh;

      display: grid;
      grid-template-columns:
        250px
        minmax(0, 650px)
        280px;

      justify-content: center;
    }

    .sidebar {
      min-height: 100vh;

      padding: 28px 20px;

      border-right:
        1px solid var(--border);

      position: sticky;
      top: 0;

      height: 100vh;
    }

    .main {
      min-width: 0;

      border-right:
        1px solid var(--border);
    }

    .rightbar {
      min-height: 100vh;
      padding: 28px 20px;
    }

    /* =========================================================
       LOGO
       ========================================================= */

    .logo {
      display: inline-block;

      font-size: 30px;
      font-weight: 950;

      letter-spacing: -.075em;
    }

    .logo-subtitle {
      color: var(--muted);

      font-size: 12px;

      margin-top: 5px;
    }

    /* =========================================================
       NAVIGATION
       ========================================================= */

    .nav {
      margin-top: 40px;

      display: flex;
      flex-direction: column;

      gap: 4px;
    }

    .nav-button {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 12px 14px;

      border: 0;
      border-radius: 14px;

      background: transparent;
      color: var(--text);

      text-align: left;

      font-weight: 650;

      transition:
        background .15s,
        transform .1s;
    }

    .nav-button:hover {
      background: var(--surface-2);
    }

    .nav-button:active {
      transform: scale(.98);
    }

    .nav-button.active {
      background: var(--surface-2);
    }

    .nav-icon {
      width: 22px;

      text-align: center;

      font-size: 19px;
    }

    /* =========================================================
       TOPBAR
       ========================================================= */

    .topbar {
      height: 66px;

      position: sticky;
      top: 0;
      z-index: 20;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 10px 16px;

      border-bottom:
        1px solid var(--border);

      background: var(--topbar-bg);

      backdrop-filter:
        blur(16px);
    }

    .mobile-logo {
      display: none;

      font-size: 20px;
      font-weight: 950;

      letter-spacing: -.06em;
    }

    .search {
      flex: 1;

      min-width: 0;

      border: 0;
      outline: 0;

      background: var(--surface-2);

      color: var(--text);

      border-radius: 999px;

      padding: 11px 16px;
    }

    .search::placeholder {
      color: var(--muted);
    }

    .search:focus {
      background: var(--surface-3);
    }

    /* =========================================================
       PROFILE MINI
       ========================================================= */

    .profile-mini {
      margin-top: 45px;

      padding-top: 20px;

      border-top:
        1px solid var(--border);
    }

    .profile-row {
      display: flex;
      align-items: center;

      gap: 11px;
    }

    .avatar {
      width: 44px;
      height: 44px;

      flex: 0 0 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--surface-2);

      font-size: 23px;
    }

    .avatar.large {
      width: 76px;
      height: 76px;

      flex-basis: 76px;

      font-size: 38px;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 750;
    }

    .profile-username {
      color: var(--muted);

      font-size: 12px;

      margin-top: 2px;
    }

    .logout-button {
      border: 0;
      background: transparent;

      padding: 0;

      margin-top: 15px;

      color: var(--muted);

      font-size: 13px;
    }

    .logout-button:hover {
      color: var(--text);
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .primary-button {
      border: 0;

      background: var(--accent);
      color: var(--accent-text);

      border-radius: 999px;

      padding: 9px 17px;

      font-size: 13px;
      font-weight: 750;
    }

    .primary-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .secondary-button {
      border: 1px solid var(--border);

      background: var(--surface);

      color: var(--text);

      border-radius: 999px;

      padding: 9px 17px;

      font-size: 13px;
      font-weight: 700;
    }

    .secondary-button:hover {
      background: var(--surface-2);
    }

    /* =========================================================
       COMPOSER
       ========================================================= */

    .composer {
      padding: 18px;

      border-bottom:
        1px solid var(--border);
    }

    .composer textarea {
      width: 100%;

      min-height: 105px;

      resize: vertical;

      border: 0;
      outline: 0;

      background: transparent;
      color: var(--text);

      font-size: 17px;
      line-height: 1.6;
    }

    .composer textarea::placeholder {
      color: var(--faint);
    }

    .composer-footer {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-top: 5px;
    }

    .hashtag-preview {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-wrap: wrap;

      gap: 6px;
    }

    .tag-pill {
      background: var(--surface-2);

      color: var(--text);

      border-radius: 999px;

      padding: 5px 9px;

      font-size: 12px;
      font-weight: 650;
    }

    /* =========================================================
       POSTS
       ========================================================= */

    .post {
      padding: 18px;

      border-bottom:
        1px solid var(--border);

      transition:
        background .15s;
    }

    .post:hover {
      background: var(--surface);
    }

    .post-inner {
      display: flex;

      gap: 12px;
    }

    .post-content {
      flex: 1;

      min-width: 0;
    }

    .post-header {
      display: flex;
      align-items: center;

      gap: 7px;

      min-width: 0;
    }

    .post-author-link {
      display: flex;
      align-items: center;

      gap: 7px;

      min-width: 0;
    }

    .post-display-name {
      font-size: 14px;
      font-weight: 750;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post-username,
    .post-time,
    .post-dot {
      color: var(--muted);

      font-size: 12px;

      white-space: nowrap;
    }

    .post-body {
      margin-top: 8px;

      white-space: pre-wrap;

      word-break: break-word;

      line-height: 1.55;

      font-size: 15px;
    }

    .post-body a {
      color: var(--blue);

      font-weight: 650;
    }

    .post-tag {
      display: inline-flex;

      margin-top: 11px;

      padding: 5px 10px;

      border-radius: 999px;

      background: var(--surface-2);

      font-size: 12px;
      font-weight: 700;
    }

    .post-tag:hover {
      background: var(--surface-3);
    }

    .post-actions {
      display: flex;
      align-items: center;

      justify-content: space-between;

      max-width: 430px;

      margin-top: 14px;

      color: var(--muted);
    }

    .action-button {
      border: 0;

      background: transparent;

      color: inherit;

      display: flex;
      align-items: center;

      gap: 6px;

      padding: 5px;

      font-size: 13px;

      border-radius: 8px;
    }

    .action-button:hover {
      background: var(--surface-2);

      color: var(--text);
    }

    .action-button.liked {
      color: var(--red);
    }

    .action-button.reposted {
      color: var(--green);
    }

    .action-icon {
      font-size: 18px;
    }

    .delete-action:hover {
      color: var(--red);
    }

    /* =========================================================
       COMMENTS
       ========================================================= */

    .comments {
      margin-top: 15px;

      padding-top: 14px;

      border-top:
        1px solid var(--border);
    }

    .comment-form {
      display: flex;

      gap: 8px;
    }

    .comment-input {
      min-width: 0;

      flex: 1;

      border:
        1px solid var(--border);

      outline: 0;

      border-radius: 999px;

      padding: 9px 13px;

      background: var(--surface);

      color: var(--text);
    }

    .comment-input:focus {
      border-color: var(--text);
    }

    .comment-button {
      border: 0;

      background: var(--accent);
      color: var(--accent-text);

      border-radius: 999px;

      padding: 9px 14px;

      font-size: 12px;
      font-weight: 750;
    }

    .comment-list {
      margin-top: 15px;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .comment {
      display: flex;

      gap: 9px;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;

      flex: 0 0 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--surface-2);

      border-radius: 50%;

      font-size: 17px;
    }

    .comment-box {
      min-width: 0;

      flex: 1;

      padding: 9px 11px;

      border-radius: 12px;

      background: var(--surface-2);
    }

    .comment-header {
      display: flex;
      align-items: center;

      gap: 6px;
    }

    .comment-name {
      font-size: 12px;
      font-weight: 750;
    }

    .comment-time {
      color: var(--muted);

      font-size: 11px;
    }

    .comment-body {
      margin-top: 4px;

      font-size: 13px;

      line-height: 1.5;

      word-break: break-word;
    }

    .comment-delete {
      border: 0;
      background: transparent;

      color: var(--muted);

      font-size: 11px;

      padding: 3px;
    }

    .comment-delete:hover {
      color: var(--red);
    }

    /* =========================================================
       NICHE HEADER
       ========================================================= */

    .niche-header {
      padding: 26px 20px;

      border-bottom:
        1px solid var(--border);
    }

    .back-button {
      border: 0;

      background: transparent;

      color: var(--muted);

      padding: 4px 0;

      font-size: 13px;
      font-weight: 650;
    }

    .back-button:hover {
      color: var(--text);
    }

    .niche-title-row {
      margin-top: 18px;

      display: flex;

      justify-content: space-between;

      gap: 15px;

      align-items: flex-start;
    }

    .niche-hash {
      font-size: 28px;

      font-weight: 950;
    }

    .niche-name {
      margin: 2px 0 0;

      font-size: 30px;

      font-weight: 950;

      letter-spacing: -.04em;
    }

    .niche-slug {
      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;
    }

    .niche-description {
      margin-top: 12px;

      color: var(--muted);

      line-height: 1.55;

      font-size: 14px;
    }

    .follow-button {
      border: 0;

      border-radius: 999px;

      padding: 9px 17px;

      background: var(--accent);
      color: var(--accent-text);

      font-weight: 750;

      font-size: 13px;
    }

    .follow-button.following {
      background: var(--surface);

      color: var(--text);

      border:
        1px solid var(--border);
    }

    .niche-stats {
      display: flex;

      gap: 25px;

      margin-top: 23px;

      font-size: 13px;
    }

    .niche-stat strong {
      font-size: 15px;
    }

    .niche-stat span {
      color: var(--muted);
    }

    /* =========================================================
       PROFILE PAGE
       ========================================================= */

    .profile-page {
      padding-bottom: 30px;
    }

    .profile-cover {
      height: 110px;

      background:
        linear-gradient(
          135deg,
          var(--surface-2),
          var(--surface-3)
        );

      border-bottom:
        1px solid var(--border);
    }

    .profile-header {
      padding: 0 20px 20px;
    }

    .profile-header-top {
      display: flex;

      justify-content: space-between;

      align-items: flex-end;

      gap: 15px;

      margin-top: -38px;
    }

    .profile-avatar {
      width: 76px;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border:
        4px solid var(--bg);

      background: var(--surface-2);

      font-size: 38px;
    }

    .profile-header-info {
      margin-top: 12px;
    }

    .profile-display-name {
      font-size: 23px;

      font-weight: 900;

      letter-spacing: -.03em;
    }

    .profile-handle {
      margin-top: 3px;

      color: var(--muted);

      font-size: 13px;
    }

    .profile-bio {
      margin-top: 13px;

      font-size: 14px;

      line-height: 1.55;
    }

    .profile-stats {
      display: flex;

      gap: 22px;

      margin-top: 17px;
    }

    .profile-stat {
      font-size: 13px;
    }

    .profile-stat strong {
      font-size: 15px;
    }

    .profile-stat span {
      color: var(--muted);
    }

    .profile-tabs {
      display: flex;

      border-bottom:
        1px solid var(--border);
    }

    .profile-tab {
      flex: 1;

      border: 0;

      background: transparent;

      color: var(--muted);

      padding: 14px;

      font-weight: 700;
    }

    .profile-tab.active {
      color: var(--text);

      box-shadow:
        inset 0 -2px 0 var(--text);
    }

    /* =========================================================
       EXPLORE
       ========================================================= */

    .page-header {
      padding: 24px 20px;

      border-bottom:
        1px solid var(--border);
    }

    .page-title {
      margin: 0;

      font-size: 28px;

      font-weight: 950;

      letter-spacing: -.04em;
    }

    .page-subtitle {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
    }

    .search-results {
      padding: 10px 0;
    }

    .result-section-title {
      padding: 13px 20px;

      font-size: 13px;

      font-weight: 800;

      color: var(--muted);

      text-transform: uppercase;

      letter-spacing: .05em;
    }

    .result-item {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 12px;

      border: 0;

      background: transparent;

      color: var(--text);

      padding: 13px 20px;

      text-align: left;
    }

    .result-item:hover {
      background: var(--surface-2);
    }

    .result-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--surface-2);

      font-size: 20px;
    }

    .result-main {
      min-width: 0;
    }

    .result-name {
      font-size: 14px;
      font-weight: 750;
    }

    .result-meta {
      margin-top: 3px;

      color: var(--muted);

      font-size: 12px;
    }

    /* =========================================================
       RIGHTBAR
       ========================================================= */

    .info-card {
      background: var(--surface-2);

      border-radius: 18px;

      padding: 18px;
    }

    .info-title {
      font-weight: 850;

      font-size: 15px;
    }

    .info-text {
      margin-top: 8px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;
    }

    .theme-card {
      margin-top: 15px;
    }

    .theme-select {
      width: 100%;

      margin-top: 12px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background: var(--surface);

      color: var(--text);

      padding: 9px 10px;

      outline: 0;
    }

    /* =========================================================
       EMPTY / LOADING
       ========================================================= */

    .empty {
      padding: 70px 25px;

      text-align: center;
    }

    .empty-icon {
      font-size: 46px;
    }

    .empty-title {
      margin-top: 15px;

      font-size: 20px;

      font-weight: 850;
    }

    .empty-text {
      margin-top: 7px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.55;
    }

    .loading {
      padding: 60px;

      text-align: center;

      color: var(--muted);
    }

    .spinner {
      width: 22px;
      height: 22px;

      margin: 0 auto 12px;

      border:
        2px solid var(--border);

      border-top-color:
        var(--text);

      border-radius: 50%;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       AUTH
       ========================================================= */

    .auth-screen {
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 25px;

      background: var(--bg);
    }

    .auth-box {
      width: 100%;

      max-width: 390px;
    }

    .auth-logo {
      text-align: center;

      font-size: 48px;

      font-weight: 950;

      letter-spacing: -.08em;
    }

    .auth-tagline {
      margin: 10px 0 30px;

      text-align: center;

      color: var(--muted);

      font-size: 14px;
    }

    .auth-form {
      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .auth-input {
      width: 100%;

      border:
        1px solid var(--border);

      border-radius: 14px;

      padding: 13px 14px;

      outline: 0;

      background: var(--surface);

      color: var(--text);
    }

    .auth-input:focus {
      border-color: var(--text);
    }

    .auth-submit {
      border: 0;

      border-radius: 14px;

      background: var(--accent);
      color: var(--accent-text);

      padding: 13px;

      font-weight: 750;
    }

    .auth-submit:disabled {
      opacity: .5;

      cursor: wait;
    }

    .auth-switch {
      width: 100%;

      margin-top: 18px;

      border: 0;

      background: transparent;

      color: var(--muted);

      font-size: 13px;
    }

    .auth-switch:hover {
      color: var(--text);
    }

    .auth-message {
      margin-top: 14px;

      padding: 11px;

      border-radius: 12px;

      background: var(--surface-2);

      text-align: center;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.5;
    }

    /* =========================================================
       PROFILE SETUP / MODAL
       ========================================================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      z-index: 100;

      background:
        var(--bg);

      overflow-y: auto;
    }

    .setup {
      width: 100%;

      max-width: 500px;

      margin: auto;

      padding: 50px 20px;
    }

    .setup-avatar {
      font-size: 42px;
    }

    .setup-title {
      margin-top: 10px;

      font-size: 30px;

      font-weight: 950;

      letter-spacing: -.04em;
    }

    .setup-subtitle {
      margin-top: 6px;

      color: var(--muted);

      font-size: 14px;
    }

    .form-group {
      margin-top: 22px;
    }

    .form-label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;

      font-weight: 750;
    }

    .form-input,
    .form-textarea {
      width: 100%;

      border:
        1px solid var(--border);

      border-radius: 14px;

      outline: 0;

      padding: 12px 14px;

      background: var(--surface);

      color: var(--text);
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--text);
    }

    .form-textarea {
      resize: vertical;
    }

    .username-wrapper {
      display: flex;

      border:

    @media (max-width: 420px) {

          repeat(6, 1fr);
      }

      .comment-form {
        flex-direction: column;
      }

      .comment-button {

  </style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =============================================================
   NICHE v2
   Single-file Supabase social application
   ============================================================= */

/* =============================================================
   CONFIGURATION
   ============================================================= */

const SUPABASE_URL =
  "https://phdwefylrpcdlfjwpdge.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yfzOWHkT7kg-gpgX_3v3aQ__vC-cRFE";

const SITE_URL =
  "https://cricketzarena592-svg.github.io/niche/";

const BASE_PATH = "/niche";

const configured =
  SUPABASE_URL &&
  SUPABASE_KEY &&
  !SUPABASE_URL.includes("YOUR_") &&
  !SUPABASE_KEY.includes("YOUR_");

let supabaseClient = null;

if (configured) {
  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
}

/* =============================================================
   STATE
   ============================================================= */

const state = {
  session: null,
  user: null,
  profile: null,

  posts: [],

  currentNiche: null,
  currentProfile: null,

  following: false,

  loading: false,

  authMode: "login",

  search: "",

  searchResults: null,

  commentOpen: {},

  comments: {},

  commentLoading: {},

  profilePosts: [],

  editingProfile: false,

  profileTab: "posts",

  theme: "system"
};

/* =============================================================
   CONSTANTS
   ============================================================= */

const EMOJIS = [
  "🙂","😎","🤓","😄",
  "😃","😌","🤠","🧑‍💻",
  "👾","🚀","🌎","🌙",
  "⭐","🔥","⚡","🎮",
  "🏏","⚽","🏀","🎵",
  "🎨","📚","💻","🐱",
  "🐶","🦊","🐼","🦁",
  "🐸","🐧","🍀","🌻"
];

/* =============================================================
   THEME
   ============================================================= */

function getSavedTheme() {
  try {
    return (
      localStorage.getItem(
        "niche-theme"
      ) || "system"
    );
  } catch {
    return "system";
  }
}

function systemPrefersDark() {
  return window.matchMedia &&
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches;
}

function applyTheme(theme) {
  state.theme = theme;

  let dark = false;

  if (theme === "dark") {
    dark = true;
  }

  if (theme === "system") {
    dark = systemPrefersDark();
  }

  document.documentElement.classList.toggle(
    "dark",
    dark
  );

  document
    .querySelector('meta[name="theme-color"]')
    ?.setAttribute(
      "content",
      dark ? "#0b0b0c" : "#ffffff"
    );

  try {
    localStorage.setItem(
      "niche-theme",
      theme
    );
  } catch {
    // Ignore storage failures.
  }
}

function setTheme(theme) {
  if (
    !["light", "dark", "system"]
      .includes(theme)
  ) {
    theme = "system";
  }

  applyTheme(theme);

  render();

  showToast(
    theme === "system"
      ? "Using system theme."
      : theme === "dark"
        ? "Dark mode enabled."
        : "Light mode enabled."
  );
}

applyTheme(
  getSavedTheme()
);

if (window.matchMedia) {
  window
    .matchMedia(
      "(prefers-color-scheme: dark)"
    )
    .addEventListener(
      "change",
      () => {
        if (
          state.theme === "system"
        ) {
          applyTheme("system");
        }
      }
    );
}

/* =============================================================
   UTILITIES
   ============================================================= */

function escapeHTML(value) {
  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return escapeHTML(value);
}

function extractHashtags(text) {
  const matches =
    String(text || "")
      .match(
        /#[a-zA-Z0-9_-]+/g
      ) || [];

  return [
    ...new Set(
      matches
        .map(tag =>
          tag
            .replace(/^#+/, "")
            .toLowerCase()
            .replace(
              /[^a-z0-9_-]/g,
              ""
            )
            .slice(0, 50)
        )
        .filter(Boolean)
    )
  ];
}

function formatTime(dateString) {
  const date =
    new Date(dateString);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "";
  }

  const now = new Date();

  const seconds =
    Math.floor(
      (now - date) / 1000
    );

  if (seconds < 60) {
    return "now";
  }

  const minutes =
    Math.floor(seconds / 60);

  if (minutes < 60) {
    return `${minutes}m`;
  }

  const hours =
    Math.floor(minutes / 60);

  if (hours < 24) {
    return `${hours}h`;
  }

  const days =
    Math.floor(hours / 24);

  if (days < 7) {
    return `${days}d`;
  }

  return date.toLocaleDateString();
}

function showToast(message) {
  const toast =
    document.getElementById(
      "toast"
    );

  if (!toast) return;

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timeout
  );

  showToast.timeout =
    setTimeout(() => {
      toast.classList.remove(
        "show"
      );
    }, 2600);
}

function normalizeUsername(username) {
  return String(
    username || ""
  )
    .trim()
    .replace(/^@/, "")
    .toLowerCase();
}

/* =============================================================
   ROUTING
   ============================================================= */

function getRoute() {
  const path =
    window.location.pathname;

  const clean =
    path
      .replace(
        new RegExp(
          "^" +
          BASE_PATH.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          )
        ),
        ""
      )
      .replace(
        /^\/+/,
        ""
      )
      .replace(
        /\/+$/,
        ""
      );

  if (!clean) {
    return {
      type: "home"
    };
  }

  const parts =
    clean.split(
      "/"
    ).filter(Boolean);

  if (
    parts[0] === "niche" &&
    parts[1]
  ) {
    return {
      type: "niche",
      topic: decodeURIComponent(
        parts
          .slice(1)
          .join("/")
      )
        .replace(/^#/, "")
        .toLowerCase()
    };
  }

  if (
    parts[0] === "profile" &&
    parts[1]
  ) {
    return {
      type: "profile",
      username:
        decodeURIComponent(
          parts[1]
        )
          .replace(/^@/, "")
          .toLowerCase()
    };
  }

  if (
    parts[0] === "explore"
  ) {
    return {
      type: "explore"
    };
  }

  if (
    parts[0] === "settings"
  ) {
    return {
      type: "settings"
    };
  }

  return {
    type: "notfound"
  };
}

function appPath(path) {
  if (!path) {
    return `${BASE_PATH}/`;
  }

  if (
    path.startsWith(
      BASE_PATH
    )
  ) {
    return path;
  }

  return `${BASE_PATH}${path.startsWith("/") ? "" : "/"}${path}`;
}

async function navigate(path) {
  const finalPath =
    appPath(path);

  if (
    window.location.pathname !==
    finalPath
  ) {
    history.pushState(
      {},
      "",
      finalPath
    );
  }

  await render();
  window.scrollTo(
    0,
    0
  );
}

window.addEventListener(
  "popstate",
  () => render()
);

/* =============================================================
   CONFIGURATION SCREEN
   ============================================================= */

function configurationScreen() {
  document.getElementById(
    "app"
  ).innerHTML = `
    <div class="auth-screen">
      <div class="auth-box">

        <div class="auth-logo">
          NICHE
        </div>

        <div class="auth-tagline">
          Everything starts with a topic.
        </div>

        <div class="info-card">

          <div class="info-title">
            Supabase configuration required
          </div>

          <div class="info-text">
            Add your Supabase URL and publishable
            key near the top of this file.
          </div>

        </div>

      </div>
    </div>
  `;
}

/* =============================================================
   AUTH
   ============================================================= */

async function signIn() {
  const email =
    document.getElementById(
      "auth-email"
    )?.value.trim();

  const password =
    document.getElementById(
      "auth-password"
    )?.value;

  if (!email || !password) {
    showToast(
      "Enter your email and password."
    );
    return;
  }

  setAuthLoading(true);

  const {
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });

  setAuthLoading(false);

  if (error) {
    showToast(
      error.message
    );
  }
}

async function signUp() {
  const email =
    document.getElementById(
      "auth-email"
    )?.value.trim();

  const password =
    document.getElementById(
      "auth-password"
    )?.value;

  if (!email || !password) {
    showToast(
      "Enter your email and password."
    );
    return;
  }

  if (
    password.length < 6
  ) {
    showToast(
      "Password must contain at least 6 characters."
    );
    return;
  }

  setAuthLoading(true);

  const {
    error
  } =
    await supabaseClient.auth
      .signUp({
        email,
        password,

        options: {
          emailRedirectTo:
            SITE_URL
        }
      });

  setAuthLoading(false);

  if (error) {
    showToast(
      error.message
    );
  } else {
    showToast(
      "Account created. Check your email for verification."
    );
  }
}

function setAuthLoading(value) {
  const button =
    document.getElementById(
      "auth-submit"
    );

  if (!button) return;

  button.disabled =
    value;

  button.textContent =
    value
      ? "Please wait..."
      : state.authMode ===
        "login"
        ? "Log in"
        : "Create account";
}

function renderAuth() {
  document.getElementById(
    "app"
  ).innerHTML = `
    <div class="auth-screen">

      <div class="auth-box">

        <div class="auth-logo">
          NICHE
        </div>

        <div class="auth-tagline">
          Everything starts with a topic.
        </div>

        <form
          class="auth-form"
          id="auth-form"
        >

          <input
            id="auth-email"
            class="auth-input"
            type="email"
            autocomplete="email"
            placeholder="Email"
            required
          >

          <input
            id="auth-password"
            class="auth-input"
            type="password"
            autocomplete="${
              state.authMode === "login"
                ? "current-password"
                : "new-password"
            }"
            placeholder="Password"
            minlength="6"
            required
          >

          <button
            id="auth-submit"
            class="auth-submit"
            type="submit"
          >
            ${
              state.authMode ===
              "login"
                ? "Log in"
                : "Create account"
            }
          </button>

        </form>

        <button
          class="auth-switch"
          id="auth-switch"
        >
          ${
            state.authMode ===
            "login"
              ? "Create a new account"
              : "Already have an account? Log in"
          }
        </button>

        <div class="auth-message">
          ${
            state.authMode ===
            "login"
              ? "Use your verified NICHE account."
              : "A verification email may be required."
          }
        </div>

      </div>

    </div>
  `;

  document
    .getElementById(
      "auth-form"
    )
    ?.addEventListener(
      "submit",
      event => {
        event.preventDefault();

        if (
          state.authMode ===
          "login"
        ) {
          signIn();
        } else {
          signUp();
        }
      }
    );

  document
    .getElementById(
      "auth-switch"
    )
    ?.addEventListener(
      "click",
      () => {
        state.authMode =
          state.authMode ===
          "login"
            ? "signup"
            : "login";

        renderAuth();
      }
    );
}

/* =============================================================
   PROFILE
   ============================================================= */

async function loadProfile() {
  if (!state.user) {
    state.profile =
      null;

    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        state.user.id
      )
      .maybeSingle();

  if (error) {
    console.error(
      "Profile load:",
      error
    );

    return;
  }

  state.profile =
    data;
}

function needsProfileSetup() {
  return (
    !state.profile ||
    !state.profile.username
  );
}

function renderProfileSetup() {
  const selected =
    state.profile?.avatar_emoji ||
    "🙂";

  const emojiButtons =
    EMOJIS.map(
      emoji => `
        <button
          type="button"
          class="emoji-button ${
            emoji === selected
              ? "selected"
              : ""
          }"
          data-emoji="${escapeAttribute(emoji)}"
        >
          ${emoji}
        </button>
      `
    ).join("");

  document.getElementById(
    "app"
  ).innerHTML = `
    <div class="modal-overlay">

      <div class="setup">

        <div
          class="setup-avatar"
          id="setup-avatar"
        >
          ${escapeHTML(selected)}
        </div>

        <div class="setup-title">
          Set up your profile
        </div>

        <div class="setup-subtitle">
          Choose how people will see you on NICHE.
        </div>

        <div class="form-group">

          <label class="form-label">
            Username
          </label>

          <div class="username-wrapper">

            <span class="username-prefix">
              @
            </span>

            <input
              id="setup-username"
              class="username-input"
              maxlength="24"
              pattern="[A-Za-z0-9_]+"
              placeholder="yourname"
              value="${escapeAttribute(
                state.profile?.username || ""
              )}"
            >

          </div>

        </div>

        <div class="form-group">

          <label class="form-label">
            Display name
          </label>

          <input
            id="setup-display-name"
            class="form-input"
            maxlength="40"
            placeholder="Your name"
            value="${escapeAttribute(
              state.profile?.display_name || ""
            )}"
          >

        </div>

        <div class="form-group">

          <label class="form-label">
            Avatar
          </label>

          <div
            class="emoji-grid"
            id="setup-emoji-grid"
          >
            ${emojiButtons}
          </div>

        </div>

        <div class="form-group">

          <label class="form-label">
            Bio
          </label>

          <textarea
            id="setup-bio"
            class="form-textarea"
            rows="3"
            maxlength="160"
            placeholder="A little about you..."
          >${escapeHTML(
            state.profile?.bio || ""
          )}</textarea>

        </div>

        <div id="setup-error"></div>

        <button
          class="setup-submit"
          id="setup-submit"
        >
          Continue to NICHE
        </button>

      </div>

    </div>
  `;

  document
    .getElementById(
      "setup-emoji-grid"
    )
    ?.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            "[data-emoji]"
          );

        if (!button) return;

        const emoji =
          button.dataset.emoji;

        state.profile =
          state.profile || {};

        state.profile.avatar_emoji =
          emoji;

        renderProfileSetup();
      }
    );

  document
    .getElementById(
      "setup-submit"
    )
    ?.addEventListener(
      "click",
      saveProfile
    );
}

async function saveProfile() {
  const username =
    document
      .getElementById(
        "setup-username"
      )
      ?.value
      .trim()
      .toLowerCase();

  const displayName =
    document
      .getElementById(
        "setup-display-name"
      )
      ?.value
      .trim();

  const bio =
    document
      .getElementById(
        "setup-bio"
      )
      ?.value
      .trim();

  const avatarEmoji =
    state.profile?.avatar_emoji ||
    "🙂";

  const errorElement =
    document.getElementById(
      "setup-error"
    );

  if (
    !/^[a-zA-Z0-9_]{3,24}$/
      .test(username)
  ) {
    errorElement.innerHTML = `
      <div class="error">
        Username must contain 3–24 letters,
        numbers, or underscores.
      </div>
    `;

    return;
  }

  const {
    data: existing,
    error: existingError
  } =
    await supabaseClient
      .from("profiles")
      .select("id")
      .eq(
        "username",
        username
      )
      .neq(
        "id",
        state.user.id
      )
      .maybeSingle();

  if (
    existingError
  ) {
    console.error(
      existingError
    );
  }

  if (existing) {
    errorElement.innerHTML = `
      <div class="error">
        That username is already taken.
      </div>
    `;

    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .update({
        username,
        display_name:
          displayName ||
          username,
        avatar_emoji:
          avatarEmoji,
        bio
      })
      .eq(
        "id",
        state.user.id
      );

  if (error) {
    errorElement.innerHTML = `
      <div class="error">
        ${escapeHTML(
          error.message
        )}
      </div>
    `;

    return;
  }

  await loadProfile();

  showToast(
    "Profile saved!"
  );

  await render();
}

/* =============================================================
   POSTS
   ============================================================= */

async function loadPosts() {
  state.loading =
    true;

  let query =
    supabaseClient
      .from("posts")
      .select(`
        *,
        author:profiles!posts_author_id_fkey(
          id,
          username,
          display_name,
          avatar_emoji,
          bio
        ),
        likes(user_id),
        reposts(user_id)
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(50);

  if (
    state.currentNiche
  ) {
    query =
      query.eq(
        "niche_id",
        state.currentNiche.id
      );
  }

  const {
    data,
    error
  } =
    await query;

  if (error) {
    console.error(
      "Posts:",
      error
    );

    state.posts =
      [];

    showToast(
      "Unable to load posts."
    );
  } else {
    state.posts =
      data || [];
  }

  state.loading =
    false;
}

async function createPost() {
  const textarea =
    document.getElementById(
      "composer-text"
    );

  if (!textarea) return;

  const body =
    textarea.value.trim();

  if (!body) return;

  const hashtags =
    extractHashtags(body);

  if (
    hashtags.length === 0
  ) {
    showToast(
      "Add a hashtag such as #football."
    );

    return;
  }

  const hashtag =
    hashtags[0];

  const button =
    document.getElementById(
      "create-post-button"
    );

  button.disabled =
    true;

  button.textContent =
    "Posting...";

  const {
    error
  } =
    await supabaseClient
      .from("posts")
      .insert({
        author_id:
          state.user.id,

        body,

        hashtag
      });

  if (error) {
    console.error(
      error
    );

    showToast(
      error.message
    );
  } else {
    textarea.value =
      "";

    updateHashtagPreview();

    showToast(
      "Posted!"
    );

    await refreshFeed();
  }

  if (
    document.getElementById(
      "create-post-button"
    )
  ) {
    button.disabled =
      false;

    button.textContent =
      "Post";
  }
}

function updateHashtagPreview() {
  const textarea =
    document.getElementById(
      "composer-text"
    );

  const preview =
    document.getElementById(
      "hashtag-preview"
    );

  const button =
    document.getElementById(
      "create-post-button"
    );

  if (
    !textarea ||
    !preview
  ) {
    return;
  }

  const tags =
    extractHashtags(
      textarea.value
    );

  preview.innerHTML =
    tags.length
      ? tags
          .map(
            tag =>
              `<span class="tag-pill">#${escapeHTML(tag)}</span>`
          )
          .join("")
      : `
          <span
            style="
              color:var(--faint);
              font-size:12px
            "
          >
            Add #topic
          </span>
        `;

  if (button) {
    button.disabled =
      !textarea.value.trim() ||
      tags.length === 0;
  }
}

async function loadComments(
  postId
) {
  state.commentLoading[
    postId
  ] = true;

  render();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("comments")
      .select(`
        *,
        author:profiles!comments_author_id_fkey(
          id,
          username,
          display_name,
          avatar_emoji
        )
      `)
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );

  if (error) {
    console.error(
      "Comments:",
      error
    );

    /*
     * Some existing databases may not have
     * the relationship named comments_author_id_fkey.
     * Try the simpler query as a fallback.
     */
    const fallback =
      await supabaseClient
        .from("comments")
        .select("*")
        .eq(
          "post_id",
          postId
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );

    if (!fallback.error) {
      state.comments[
        postId
      ] =
        fallback.data || [];
    } else {
      state.comments[
        postId
      ] = [];

      showToast(
        "Unable to load comments."
      );
    }
  } else {
    state.comments[
      postId
    ] =
      data || [];
  }

  state.commentLoading[
    postId
  ] = false;

  render();
}

      ]

  ] =

  if (
    !open &&
    !state.comments[
      postId

    await loadComments(
      postId

    render();
  }

async function sharePost(
  postId
) {
  const url =
    `${window.location.origin}${BASE_PATH}/?post=${encodeURIComponent(postId)}`;

  const post =
    state.posts.find(
      item =>
        String(item.id) ===
        String(postId)
    );

  try {
    if (
      navigator.share
    ) {
      await navigator.share({
        title:
          "NICHE",
        text:
          post?.body ||
          "Check out this post on NICHE.",
        url
      });
    } else {
      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "Post link copied."
      );
    }
  } catch {
    // User cancelled.
  }
}

/* =============================================================
   POST BODY RENDERING
   ============================================================= */

function renderPostBody(
  text
) {
  const escaped =
    escapeHTML(
      text || ""
    );

  const parts =
    escaped.split(
      /(#[a-zA-Z0-9_-]+)/g
    );

  return parts
    .map(part => {
      if (
        /^#[a-zA-Z0-9_-]+$/
          .test(part)
      ) {
        const topic =
          part
            .slice(1)
            .toLowerCase();

        return `
          <a
            href="${appPath(
              `/niche/${encodeURIComponent(topic)}`
            )}"
            data-route="niche"
            data-topic="${escapeAttribute(topic)}"
          >
            ${escapeHTML(part)}
          </a>
        `;
      }

      return part;
    })
    .join("")
    .replace(
      /\n/g,
      "<br>"
    );
}

) {

      postId
    ] || [];

    state.commentLoading[
      postId
    ];

  return `
    <div class="comments">

      <form
        class="comment-form"
        data-comment-form="${escapeAttribute(
          postId
        )}"
      >

        <input
          id="comment-${escapeAttribute(
            postId
          )}"
          class="comment-input"
          maxlength="500"
          placeholder="Write a comment..."
        >

        <button
          class="comment-button"
          type="submit"
          data-comment-submit="${escapeAttribute(
            postId
          )}"
        >
          Send
        </button>

      </form>

      ${
        loading
          ? `
            <div class="loading">
              <div class="spinner"></div>
              Loading comments...
            </div>
          `
          : comments.length === 0
            ? `
              <div
                class="muted small"
                style="
                  margin-top:14px;
                  text-align:center
                "
              >
                No comments yet.
              </div>
            `
            : `

                  .map(

                      renderComment(
                        comment,
                        postId
                      )
                  )
                  .join("")}
              </div>
            `
      }

    </div>
  `;
}

function renderComment(
  comment,
  postId
) {
  const author =
    comment.author ||
    {};

  const username =
    author.username ||

    author.display_name ||

    "User";

  const canDelete =
    comment.author_id ===

  return `

          `/profile/${encodeURIComponent(username)}`
        )}"

            )}"

            data-username="${escapeAttribute(
              username
            )}"

          </a>

/* =============================================================
   POST HTML
   ============================================================= */

function renderPost(
  post
) {
  const liked =
    isLiked(post);

  const reposted =
    isReposted(post);

  const commentOpen =
    Boolean(
      state.commentOpen[
        post.id
      ]
    );

  const author =
    post.author ||
    {};

  const displayName =
    author.display_name ||
    author.username ||
    "User";

  const username =
    author.username ||
    "";

  const commentCount =
    Number(
      post.comment_count ||
      state.comments[
        post.id
      ]?.length ||
      0
    );

  return `
    <article
      class="post"
      data-post-id="${escapeAttribute(
        post.id
      )}"
    >

      <div class="post-inner">

        <a
          class="avatar"
          href="${appPath(
            `/profile/${encodeURIComponent(username)}`
          )}"
          data-route="profile"
          data-username="${escapeAttribute(
            username
          )}"
          aria-label="View profile"
        >
          ${escapeHTML(
            author.avatar_emoji ||
            "🙂"
          )}
        </a>

        <div class="post-content">

          <div class="post-header">

            <a
              class="post-author-link"
              href="${appPath(
                `/profile/${encodeURIComponent(username)}`
              )}"
              data-route="profile"
              data-username="${escapeAttribute(
                username
              )}"
            >

              <span class="post-display-name">
                ${escapeHTML(
                  displayName
                )}
              </span>

              ${
                username
                  ? `
                    <span class="post-username">
                      @${escapeHTML(
                        username
                      )}
                    </span>
                  `
                  : ""
              }

            </a>

            <span class="post-dot">
              ·
            </span>

            <span class="post-time">
              ${escapeHTML(
                formatTime(
                  post.created_at
                )
              )}
            </span>

          </div>

          <div class="post-body">
            ${renderPostBody(
              post.body
            )}
          </div>

          ${
            post.hashtag
              ? `
                <a
                  class="post-tag"
                  href="${appPath(
                    `/niche/${encodeURIComponent(
                      post.hashtag
                    )}`
                  )}"
                  data-route="niche"
                  data-topic="${escapeAttribute(
                    post.hashtag
                  )}"
                >
                  #${escapeHTML(
                    post.hashtag
                  )}
                </a>
              `
              : ""
          }

          <div class="post-actions">

            <button
              class="action-button"
              data-action="comments"
              data-post-id="${escapeAttribute(
                post.id
              )}"
              type="button"
            >
              <span class="action-icon">
                💬
              </span>

              <span>
                ${commentCount}
              </span>
            </button>

            <button
              class="action-button ${
                reposted
                  ? "reposted"
                  : ""
              }"
              data-action="repost"
              data-post-id="${escapeAttribute(
                post.id
              )}"
              type="button"
            >
              <span class="action-icon">
                ↻
              </span>

              <span>
                ${Number(
                  post.repost_count ||
                  post.reposts?.length ||
                  0
                )}
              </span>
            </button>

            <button
              class="action-button ${
                liked
                  ? "liked"
                  : ""
              }"
              data-action="like"
              data-post-id="${escapeAttribute(
                post.id
              )}"
              type="button"
            >
              <span class="action-icon">
                ${liked
                  ? "♥"
                  : "♡"}
              </span>

              <span>
                ${Number(
                  post.like_count ||
                  post.likes?.length ||
                  0
                )}
              </span>
            </button>

            <button
              class="action-button"
              data-action="share"
              data-post-id="${escapeAttribute(
                post.id
              )}"
              type="button"
            >
              <span class="action-icon">
                ↗

              state.user?.id ===
              post.author_id
                ? `

                    data-action="delete"
                    data-post-id="${escapeAttribute(
                      post.id
                    )}"
                    type="button"
                  >
                    <span class="action-icon">
                      ×
                    </span>
                  </button>
                `
                : ""
            }

          </div>

          ${
            commentOpen
              ? renderComments(
                  post.id
                )
              : ""
          }

        </div>

      </div>

    </article>
  `;
}

async function searchAll(
  queryText
) {
  const q =
    String(
      queryText || ""
    )
      .trim()
      .replace(/^#/, "");

  if (!q) {
    state.searchResults =
      null;

    render();

    return;
  }

  state.search =
    q;

  state.searchResults = {
    niches: [],
    profiles: [],
    posts: []
  };

  const [
    nichesResult,
    profilesResult,
    postsResult
  ] =
    await Promise.all([
      supabaseClient
        .from("niches")
        .select("*")
        .ilike(
          "slug",
          `%${q}%`
        )
        .limit(10),

      supabaseClient
        .from("profiles")
        .select("*")
        .or(
          `username.ilike.%${q}%,display_name.ilike.%${q}%`
        )
        .limit(10),

      supabaseClient
        .from("posts")
        .select(`
          *,
          author:profiles!posts_author_id_fkey(
            id,
            username,
            display_name,
            avatar_emoji
          )
        `)
        .ilike(
          "body",
          `%${q}%`
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        )
        .limit(10)
    ]);

  state.searchResults =
    {
      niches:
        nichesResult.data ||
        [],
      profiles:
        profilesResult.data ||
        [],
      posts:
        postsResult.data ||
        []
    };

  render();
}

function setupGlobalEvents() {
  const app =
    document.getElementById(
      "app"
    );

  if (!app) return;

  app.onclick =
    async event => {

      const nav =
        event.target.closest(
          "[data-nav]"
        );

      if (nav) {
        event.preventDefault();

        await navigate(
          nav.dataset.nav
        );

        return;
      }

      const route =
        event.target.closest(
          "[data-route]"
        );

      if (route) {
        event.preventDefault();

        if (
          route.dataset.route ===
          "niche"
        ) {
          await navigate(
            `/niche/${encodeURIComponent(
              route.dataset.topic
            )}`
          );

          return;
        }

        if (
          route.dataset.route ===
          "profile"
        ) {
          await navigate(
            `/profile/${encodeURIComponent(
              route.dataset.username
            )}`
          );

          return;
        }
      }

      const action =
        event.target.closest(
          "[data-action]"
        );

      if (action) {
        const type =
          action.dataset.action;

        const postId =
          action.dataset.postId;

        if (
          type ===
          "comments"
        ) {
          await toggleComments(
            postId
          );

          return;
        }

        if (
          type ===
          "like"
        ) {
          await toggleLike(
            postId
          );

          return;
        }

        if (
          type ===
          "repost"
        ) {
          await toggleRepost(
            postId
          );

          return;
        }

        if (
          type ===
          "share"
        ) {
          await sharePost(
            postId
          );

          return;
        }

        if (
          type ===
          "delete"
        ) {
          await deletePost(
            postId
          );

          return;
        }
      }

      const deleteCommentButton =
        event.target.closest(
          "[data-delete-comment]"
        );

      if (
        deleteCommentButton
      ) {
        await deleteComment(
          deleteCommentButton
            .dataset
            .deleteComment,

          deleteCommentButton
            .dataset
            .postId
        );

        return;
      }
    };

  app.onsubmit =
    async event => {

      const form =
        event.target.closest(
          "[data-comment-form]"
        );

      if (!form) return;

      event.preventDefault();

      const postId =
        form.dataset
          .commentForm;

      await submitComment(
        postId
      );
    };

  const composer =
    document.getElementById(
      "composer-text"
    );

  if (composer) {
    composer.addEventListener(
      "input",
      updateHashtagPreview
    );

    composer.addEventListener(
      "keydown",
      event => {
        if (
          (event.ctrlKey ||
            event.metaKey) &&
          event.key ===
            "Enter"
        ) {
          event.preventDefault();

          createPost();
        }
      }
    );
  }

  document
    .getElementById(
      "create-post-button"
    )
    ?.addEventListener(
      "click",
      createPost
    );

  document
    .getElementById(
      "niche-follow-button"
    )
    ?.addEventListener(
      "click",
      toggleFollow
    );

  document
    .getElementById(
      "edit-profile-button"
    )
    ?.addEventListener(
      "click",
      () => {
        state.editingProfile =
          true;

        renderProfileEditor();
      }
    );

  const search =
    document.getElementById(
      "search"
    );

  if (search) {
    search.addEventListener(
      "keydown",
      async event => {
        if (
          event.key !==
          "Enter"
        ) {
          return;
        }

        const value =
          search.value.trim();

        if (!value) {
          await navigate(
            "/explore"
          );

          return;
        }

        state.search =
          value;

        await navigate(
          "/explore"
        );

        await searchAll(
          value
        );
      }
    );
  }

  document
    .getElementById(
      "sidebar-theme"
    )
    ?.addEventListener(
      "change",
      event =>
        setTheme(
          event.target.value
        )
    );

  document
    .getElementById(
      "settings-theme"
    )
    ?.addEventListener(
      "change",
      event =>
        setTheme(
          event.target.value
        )
    );

  document
    .getElementById(
      "sidebar-logout"
    )
    ?.addEventListener(
      "click",
      logout
    );

  document
    .getElementById(
      "settings-logout"
    )
    ?.addEventListener(
      "click",
      logout
    );
}

        const button =
          event.target.closest(
            "[data-edit-emoji]"
          );

        if (!button) {
          return;
        }

        selectedEmoji =
          button.dataset
            .editEmoji;

        document
          .querySelectorAll(
            "[data-edit-emoji]"
          )
          .forEach(
            item =>
              item.classList.toggle(
                "selected",
                item.dataset
                  .editEmoji ===
                  selectedEmoji
              )
          );
      }
    );

  document
    .getElementById(
      "cancel-profile-edit"
    )
    ?.addEventListener(
      "click",
      () => {
        state.editingProfile =
          false;

        render();
      }
    );

  document
    .getElementById(
      "save-profile-edit"
    )
    ?.addEventListener(
      "click",
      async () => {

        const username =
          normalizeUsername(
            document.getElementById(
              "edit-username"
            ).value
          );

        const displayName =
          document
            .getElementById(
              "edit-display-name"
            )
            .value
            .trim();

        const bio =
          document
            .getElementById(
              "edit-bio"
            )
            .value
            .trim();

        const errorElement =
          document.getElementById(
            "edit-profile-error"
          );

        if (
          !/^[a-zA-Z0-9_]{3,24}$/
            .test(username)
        ) {
          errorElement.innerHTML = `
            <div class="error">
              Username must contain 3–24 letters,
              numbers, or underscores.
            </div>
          `;

          return;
        }

        const {
          data: existing
        } =
          await supabaseClient
            .from("profiles")
            .select("id")
            .eq(
              "username",
              username
            )
            .neq(
              "id",
              state.user.id
            )
            .maybeSingle();

        if (existing) {
          errorElement.innerHTML = `
            <div class="error">
              That username is already taken.
            </div>
          `;

          return;
        }

        const {
          error
        } =
          await supabaseClient
            .from("profiles")
            .update({
              username,
              display_name:
                displayName ||
                username,
              avatar_emoji:
                selectedEmoji,
              bio
            })
            .eq(
              "id",
              state.user.id
            );

        if (error) {
          errorElement.innerHTML = `
            <div class="error">
              ${escapeHTML(
                error.message
              )}
            </div>
          `;

          return;
        }

        state.editingProfile =
          false;

        await loadProfile();

        showToast(
          "Profile updated."
        );

        await render();
      }
    );
}

/* =============================================================
   LOGOUT
   ============================================================= */

async function logout() {
  const {
    error
  } =
    await supabaseClient.auth
      .signOut();

  if (error) {
    showToast(
      error.message
    );

    return;
  }

  state.session =
    null;

  state.user =
    null;

  state.profile =
    null;

  state.currentNiche =
    null;

  state.currentProfile =
    null;

  showToast(
    "Logged out."
  );

  render();
}

/* =============================================================
   REFRESH
   ============================================================= */

async function refreshFeed() {
  const route =
    getRoute();

  if (
    route.type ===
    "niche"
  ) {
    await loadNiche(
      route.topic
    );

    await loadFollowState();
  } else {
    state.currentNiche =
      null;

    state.following =
      false;
  }

  await loadPosts();

  render();
}

/* =============================================================
   REALTIME
   ============================================================= */

let realtimeChannel =
  null;

function setupRealtime() {
  if (
    !supabaseClient
  ) {
    return;
  }

  if (
    realtimeChannel
  ) {
    try {
      supabaseClient
        .removeChannel(
          realtimeChannel
        );
    } catch {
      // Ignore.
    }
  }

  realtimeChannel =
    supabaseClient
      .channel(
        "niche-global-v2"
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "posts"
        },
        async () => {
          await refreshFeed();
        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "likes"
        },
        async () => {
          await refreshFeed();
        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "reposts"
        },
        async () => {
          await refreshFeed();
        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "comments"
        },
        async payload => {

          if (
            payload.eventType ===
            "INSERT"
          ) {
            const postId =
              payload.new
                ?.post_id;

            if (
              postId &&
              state.commentOpen[
                postId
              ]
            ) {
              await loadComments(
                postId
              );
            }
          }

          await refreshFeed();
        }
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "niche_followers"
        },
        async () => {
          await refreshFeed();
        }
      )

      .subscribe();
}

/* =============================================================
   MAIN RENDER
   ============================================================= */

async function render() {
  if (!configured) {
    configurationScreen();

    return;
  }

  if (!state.session) {
    renderAuth();

    return;
  }

  if (
    needsProfileSetup()
  ) {
    renderProfileSetup();

    return;
  }

  if (
    state.editingProfile
  ) {
    renderProfileEditor();

    return;
  }

  const route =
    getRoute();

  if (
    route.type ===
    "niche"
  ) {
    state.search =
      `#${route.topic}`;

    await loadNiche(
      route.topic
    );

    await loadFollowState();

    await loadPosts();

    document.getElementById(
      "app"
    ).innerHTML =
      renderLayout(
        renderNichePage(),
        route
      );

    setupGlobalEvents();

    return;
  }

  if (
    route.type ===
    "profile"
  ) {
    state.search =
      "";

    await loadPublicProfile(
      route.username
    );

    await loadProfilePosts();

    document.getElementById(
      "app"
    ).innerHTML =
      renderLayout(
        await renderProfilePage(),
        route
      );

    setupGlobalEvents();

    return;
  }

  if (
    route.type ===
    "explore"
  ) {
    document.getElementById(
      "app"
    ).innerHTML =
      renderLayout(
        renderExplore(),
        route
      );

    setupGlobalEvents();

    return;
  }

  if (
    route.type ===
    "settings"
  ) {
    document.getElementById(
      "app"
    ).innerHTML =
      renderLayout(
        renderSettings(),
        route
      );

    setupGlobalEvents();

    return;
  }

  if (
    route.type ===
    "notfound"
  ) {
    document.getElementById(
      "app"
    ).innerHTML =
      renderLayout(
        `
          <div class="empty">

            <div class="empty-icon">
              404
            </div>

            <div class="empty-title">
              Page not found
            </div>

            <div class="empty-text">
              The page you're looking for doesn't exist.
            </div>

            <button
              class="primary-button"
              style="margin-top:20px"
              data-nav="/"
              type="button"
            >
              Go home
            </button>

          </div>
        `,
        route
      );

    setupGlobalEvents();

    return;
  }

  state.currentNiche =
    null;

  state.currentProfile =
    null;

  state.following =
    false;

  state.search =
    "";

  await loadPosts();

  document.getElementById(
    "app"
  ).innerHTML =
    renderLayout(
      renderHome(),
      route
    );

  setupGlobalEvents();
}

/* =============================================================
   INITIALIZATION
   ============================================================= */

async function initialize() {
  if (!configured) {
    configurationScreen();

    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();

  if (error) {
    console.error(
      "Session:",
      error
    );
  }

  state.session =
    data?.session ||
    null;

  state.user =
    data?.session?.user ||
    null;

  if (state.user) {
    await loadProfile();
  }

  await render();

  setupRealtime();

  supabaseClient.auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        state.session =
          session ||
          null;

        state.user =
          session?.user ||
          null;

        if (
          state.user
        ) {
          await loadProfile();
        } else {
          state.profile =
            null;
        }

        await render();
      }
    );
}

/* =============================================================
   START
   ============================================================= */

initialize();

</script>
