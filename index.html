<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>NICHE — Everything starts with a topic</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#09090a;
  --surface:#101012;
  --surface2:#171719;
  --surface3:#222225;
  --text:#f5f5f7;
  --muted:#96969e;
  --border:#29292e;
  --blue:#70a7ff;
  --red:#ff7180;
  --green:#55d98b;
  --top:rgba(9,9,10,.86)
}

html[data-theme=light]{
  color-scheme:light;
  --bg:#fff;
  --surface:#fff;
  --surface2:#f5f5f6;
  --surface3:#e9e9ec;
  --text:#111114;
  --muted:#6d6e75;
  --border:#e4e4e7;
  --blue:#2563eb;
  --red:#e5485d;
  --green:#15945b;
  --top:rgba(255,255,255,.88)
}

html[data-theme=system]{color-scheme:light dark}

@media(prefers-color-scheme:dark){
  html[data-theme=system]{
    --bg:#09090a;
    --surface:#101012;
    --surface2:#171719;
    --surface3:#222225;
    --text:#f5f5f7;
    --muted:#96969e;
    --border:#29292e;
    --blue:#70a7ff;
    --red:#ff7180;
    --green:#55d98b;
    --top:rgba(9,9,10,.86)
  }
}

@media(prefers-color-scheme:light){
  html[data-theme=system]{
    --bg:#fff;
    --surface:#fff;
    --surface2:#f5f5f6;
    --surface3:#e9e9ec;
    --text:#111114;
    --muted:#6d6e75;
    --border:#e4e4e7;
    --blue:#2563eb;
    --red:#e5485d;
    --green:#15945b;
    --top:rgba(255,255,255,.88)
  }
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif
}

button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{min-height:100vh}

.shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:245px minmax(0,680px) 290px;
  justify-content:center
}

.side{
  height:100vh;
  position:sticky;
  top:0;
  padding:25px 18px;
  border-right:1px solid var(--border)
}

.main{
  min-width:0;
  border-right:1px solid var(--border)
}

.right{padding:25px 18px}

.brand{
  display:inline-block;
  padding:5px 9px
}

.brand b{
  display:block;
  font-size:31px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.08em
}

.brand span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:11px
}

.nav{
  margin-top:34px;
  display:grid;
  gap:4px
}

.nav button{
  border:0;
  background:transparent;
  color:var(--text);
  padding:12px 13px;
  border-radius:13px;
  text-align:left;
  font-weight:750
}

.nav button:hover{background:var(--surface2)}

.nav i{
  display:inline-block;
  width:25px;
  font-style:normal;
  text-align:center;
  margin-right:7px
}

.mini{
  margin-top:40px;
  padding:18px 9px;
  border-top:1px solid var(--border);
  display:flex;
  gap:10px;
  align-items:center
}

.mini .txt{min-width:0}

.mini strong,.mini small{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.mini strong{font-size:13px}

.mini small{
  color:var(--muted);
  margin-top:2px
}

.mini-actions{
  padding-left:9px;
  display:flex;
  gap:13px
}

.linkbtn{
  border:0;
  background:none;
  color:var(--muted);
  padding:0;
  font-size:12px
}

.linkbtn:hover{color:var(--text)}

.top{
  height:68px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  background:var(--top);
  backdrop-filter:blur(16px)
}

.mobile-brand{
  display:none;
  font-weight:950;
  font-size:21px;
  letter-spacing:-.06em
}

.searchbox{
  position:relative;
  flex:1
}

.search{
  width:100%;
  border:1px solid transparent;
  outline:0;
  border-radius:999px;
  background:var(--surface2);
  color:var(--text);
  padding:11px 16px
}

.search:focus{
  background:var(--surface);
  border-color:var(--border)
}

.theme{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface);
  color:var(--text)
}

.notif-wrap{
  position:relative;
  z-index:90
}

.notif{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--surface);
  color:var(--text);
  position:relative
}

.notif-badge{
  position:absolute;
  top:-3px;
  right:-2px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-size:9px;
  font-weight:900;
  display:grid;
  place-items:center;
  border:2px solid var(--bg)
}

.notif-menu{
  position:fixed;
  right:16px;
  top:74px;
  width:330px;
  max-width:calc(100vw - 24px);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
  overflow:hidden;
  z-index:80
}

.notif-head{
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border)
}

.notif-head strong{font-size:13px}

.notif-head button{
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px
}

.notif-list{
  max-height:360px;
  overflow:auto
}

.notification{
  display:flex;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--border)
}

.notification:last-child{border-bottom:0}

.notification:hover{background:var(--surface2)}

.notification .avatar{
  width:34px;
  height:34px;
  flex-basis:34px;
  font-size:17px
}

.notification-text{
  font-size:12px;
  line-height:1.45
}

.notification-text b{font-weight:850}

.notification-time{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px
}

.notif-empty{
  padding:28px 18px;
  text-align:center;
  color:var(--muted);
  font-size:12px
}

.following-list{
  display:grid;
  gap:7px;
  margin-top:12px
}

.following-item{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
  border-radius:12px;
  background:var(--surface2)
}

.following-item:hover{background:var(--surface3)}

.following-item .avatar{
  width:32px;
  height:32px;
  flex-basis:32px;
  font-size:16px
}

.following-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.following-slug{
  font-size:10px;
  color:var(--muted);
  margin-top:2px
}

.edit-profile{
  display:flex;
  justify-content:flex-end;
  margin-bottom:15px
}

.profile-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px
}

.customize-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.customize-preview{
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--surface2)
}

.customize-preview .avatar{
  width:58px;
  height:58px;
  flex-basis:58px;
  font-size:29px
}

.setting-section+.setting-section{
  border-top:1px solid var(--border)
}

.avatar{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border:1px solid var(--border);
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--surface2);
  font-size:22px
}

.avatar.big{
  width:76px;
  height:76px;
  flex-basis:76px;
  font-size:39px
}

.card{
  padding:17px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--surface)
}

.card+.card{margin-top:12px}

.card h3{
  margin:0;
  font-size:14px
}

.card p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.55
}

.primary,.secondary,.danger{
  border-radius:999px;
  padding:9px 16px;
  font-size:13px;
  font-weight:800
}

.primary{
  border:0;
  background:var(--text);
  color:var(--bg)
}

.secondary{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text)
}

.danger{
  border:1px solid color-mix(in srgb,var(--red) 25%,transparent);
  background:color-mix(in srgb,var(--red) 9%,transparent);
  color:var(--red)
}

button:disabled{
  opacity:.4;
  cursor:not-allowed
}

.composer{
  padding:19px 18px 15px;
  border-bottom:1px solid var(--border);
  display:flex;
  gap:12px
}

.formatbar{
  display:flex;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
  margin:0 0 8px
}

.formatbtn{
  min-width:30px;
  height:30px;
  padding:0 8px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--surface2);
  color:var(--text);
  font-size:12px;
  font-weight:800
}

.formatbtn:hover{background:var(--surface3)}

.format-help{
  margin-left:4px;
  color:var(--muted);
  font-size:10px
}

.moderation-warning{
  margin-top:8px;
  padding:9px 11px;
  border-radius:11px;
  background:color-mix(in srgb,var(--red) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--red) 22%,transparent);
  color:var(--red);
  font-size:11px;
  line-height:1.45
}

.moderation-ok{
  margin-top:8px;
  color:var(--green);
  font-size:10px
}

.body strong{font-weight:900}

.body code{
  padding:2px 5px;
  border-radius:6px;
  background:var(--surface2);
  border:1px solid var(--border);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:.9em
}

.body em{font-style:italic}

.body u{text-decoration:underline;text-underline-offset:2px}

.body s{text-decoration:line-through}

.format-note{
  margin-top:8px;
  color:var(--muted);
  font-size:10px;
  line-height:1.4
}

.composer-main{
  flex:1;
  min-width:0
}

.composer textarea{
  width:100%;
  min-height:82px;
  resize:vertical;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:17px;
  line-height:1.55
}

.composer textarea::placeholder{color:var(--muted)}

.composer-foot{
  display:flex;
  align-items:center;
  gap:9px
}

.tags{
  flex:1;
  display:flex;
  flex-wrap:wrap;
  gap:6px
}

.tag{
  padding:5px 9px;
  border-radius:999px;
  background:var(--surface2);
  font-size:12px;
  font-weight:750
}

.count{
  color:var(--muted);
  font-size:11px
}

.post{
  padding:19px 18px;
  border-bottom:1px solid var(--border)
}

.post:hover{
  background:color-mix(in srgb,var(--surface2) 42%,transparent)
}

.post-row{
  display:flex;
  gap:12px
}

.post-main{
  flex:1;
  min-width:0
}

.head{
  display:flex;
  align-items:baseline;
  gap:7px;
  min-width:0
}

.name{
  font-size:14px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:240px
}

.handle,.time{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap
}

.dot{color:var(--muted)}

.body{
  margin-top:8px;
  font-size:15px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  text-indent:0
}

.hashtag{
  color:var(--blue);
  font-weight:700
}

.posttag{
  display:inline-flex;
  margin-top:12px;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--surface2);
  font-size:12px;
  font-weight:800
}

.actions{
  max-width:470px;
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  color:var(--muted)
}

.action{
  border:0;
  background:transparent;
  color:inherit;
  border-radius:999px;
  padding:5px 8px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px
}

.action:hover{
  background:var(--surface2);
  color:var(--text)
}

.liked{color:var(--red)}
.reposted{color:var(--green)}

.comments{
  margin-top:14px;
  padding-top:13px;
  border-top:1px solid var(--border)
}

.comment-form{
  display:flex;
  gap:8px
}

.comment-input{
  min-width:0;
  flex:1;
  border:1px solid var(--border);
  outline:0;
  border-radius:999px;
  background:var(--surface);
  color:var(--text);
  padding:9px 13px
}

.comment-input:focus{border-color:var(--text)}

.comment-list{
  margin-top:11px;
  display:grid;
  gap:8px
}

.comment{
  display:flex;
  gap:8px;
  padding:9px;
  border-radius:13px;
  background:var(--surface2)
}

.comment .avatar{
  width:30px;
  height:30px;
  flex-basis:30px;
  font-size:16px
}

.comment-text{min-width:0}

.comment-meta{font-size:11px}

.comment-meta span{
  color:var(--muted);
  margin-left:5px
}

.comment-body{
  margin-top:3px;
  font-size:13px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
  text-indent:0
}

.comment-empty{
  color:var(--muted);
  font-size:12px;
  margin-top:10px
}

.header{
  padding:24px 20px 19px;
  border-bottom:1px solid var(--border)
}

.back{
  border:0;
  background:none;
  color:var(--muted);
  padding:0;
  margin-bottom:17px;
  font-size:13px;
  font-weight:700
}

.title-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start
}

.title{
  margin:0;
  font-size:30px;
  line-height:1.05;
  font-weight:950;
  letter-spacing:-.05em
}

.sub{
  margin-top:7px;
  color:var(--muted);
  font-size:13px
}

.desc{
  margin-top:11px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.stats{
  display:flex;
  gap:23px;
  margin-top:17px;
  font-size:12px;
  flex-wrap:wrap
}

.stats b{font-size:14px}

.stats span{color:var(--muted)}

.profile-head{
  display:flex;
  gap:15px;
  align-items:flex-start
}

.profile-info{
  min-width:0
}

.profile-name{
  font-size:24px;
  font-weight:900;
  letter-spacing:-.04em
}

.profile-handle{
  color:var(--muted);
  font-size:13px;
  margin-top:3px
}

.bio{
  margin-top:10px;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
  text-indent:0
}

.explore{
  padding:24px 20px 16px;
  border-bottom:1px solid var(--border)
}

.explore h1,.settings h1{
  margin:0;
  font-size:25px;
  letter-spacing:-.04em
}

.results .result{
  display:block;
  padding:16px 18px;
  border-bottom:1px solid var(--border)
}

.result:hover{background:var(--surface2)}

.result b{font-size:14px}

.result small{
  display:block;
  color:var(--muted);
  margin-top:5px
}

.empty,.loading{
  text-align:center;
  padding:70px 25px
}

.empty .icon{font-size:42px}

.empty h2{
  font-size:19px;
  margin:14px 0 7px
}

.empty p{
  max-width:420px;
  margin:0 auto;
  color:var(--muted);
  font-size:13px;
  line-height:1.55
}

.error{
  margin:15px 18px;
  padding:12px 14px;
  border-radius:13px;
  background:color-mix(in srgb,var(--red) 9%,transparent);
  color:var(--red);
  font-size:12px
}

.loading{
  color:var(--muted);
  font-size:13px
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:25px;
  background:
    radial-gradient(circle at 50% 0,
    color-mix(in srgb,var(--text) 6%,transparent),
    transparent 40%),
    var(--bg)
}

.authbox{
  width:100%;
  max-width:390px
}

.authlogo{
  text-align:center;
  font-size:53px;
  font-weight:950;
  letter-spacing:-.09em
}

.tagline{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin:10px 0 27px
}

.authcard{
  padding:18px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--surface);
  box-shadow:0 20px 60px rgba(0,0,0,.2)
}

.authform{
  display:grid;
  gap:10px
}

.input,.textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:13px;
  outline:0;
  background:var(--surface2);
  color:var(--text);
  padding:13px
}

.input:focus,.textarea:focus{
  background:var(--surface);
  border-color:var(--text)
}

.switch{
  width:100%;
  border:0;
  background:none;
  color:var(--muted);
  margin-top:14px;
  font-size:12px
}

.setup{
  min-height:100vh;
  padding:45px 20px;
  max-width:510px;
  margin:auto
}

.setup h1{
  font-size:30px;
  letter-spacing:-.05em
}

.group{margin-top:19px}

.label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:7px
}

.username{
  display:flex;
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  background:var(--surface)
}

.username span{
  padding:12px 13px;
  background:var(--surface2);
  color:var(--muted)
}

.username input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:12px
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px
}

.emoji{
  aspect-ratio:1;
  border:1px solid transparent;
  border-radius:11px;
  background:var(--surface2);
  color:var(--text);
  font-size:21px
}

.emoji.selected{
  border-color:var(--text);
  background:var(--surface3)
}

.setting-section{
  padding:22px 20px;
  border-bottom:1px solid var(--border)
}

.setting-section p{
  color:var(--muted);
  font-size:12px;
  line-height:1.5
}

.themes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px
}

.themeopt{
  text-align:left;
  padding:12px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--surface);
  color:var(--text);
  font-size:12px;
  font-weight:800
}

.themeopt.active{
  border-color:var(--text);
  background:var(--surface2)
}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:200;
  display:grid;
  place-items:center;
  padding:18px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px)
}

.modal{
  width:min(430px,100%);
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
  padding:20px
}

.modal h2{
  margin:0;
  font-size:20px
}

.modal p{
  color:var(--muted);
  font-size:13px;
  line-height:1.55

function time(v){
  let s=Math.floor((Date.now()-new Date(v))/1000);

  if(!Number.isFinite(s)||s<60)return"now";

  let m=Math.floor(s/60);

  if(m<60)return m+"m";

  let h=Math.floor(m/60);

  if(h<24)return h+"h";

  let d=Math.floor(h/24);

  return d<7
    ? d+"d"
    : new Date(v).toLocaleDateString();
}

function route(){
  let r=location.hash.replace(/^#/,"")||"/";

  if(!r.startsWith("/"))r="/"+r;

  r=r.split("?")[0];

  let n=r.match(/^\/niche\/([^/]+)\/?$/i);

  if(n){
    return{
      type:"niche",
      topic:topic(decodeURIComponent(n[1]))
    };
  }

  if(/^\/profile\/edit\/?$/i.test(r)){
    return{type:"profile-edit"};
  }

  let p=r.match(/^\/profile\/([^/]+)\/?$/i);

  if(p){
    return{
      type:"profile",
      username:decodeURIComponent(p[1])
        .replace(/^@/,"")
        .toLowerCase()
    };
  }

  if(/^\/explore\/?$/i.test(r)){
    return{type:"explore"};
  }

  if(/^\/settings\/?$/i.test(r)){
    return{type:"settings"};
  }

  let q=r.match(/^\/post\/([^/]+)\/?$/i);

  if(q){
    return{
      type:"post",
      id:decodeURIComponent(q[1])
    };
  }

  return{type:"home"};
}

async function signup(){
  let e=document.getElementById("email")?.value.trim();
  let p=document.getElementById("password")?.value||"";

  if(!e||!p){
    return toast("Enter your email and password.");
  }

  if(p.length<6){
    return toast("Password must contain at least 6 characters.");
  }

  S.busy=true;
  renderAuth();

  /*
   * Do NOT append a hash route here. Supabase may use the URL hash
   * for the verification session, and a router hash such as #/ can
   * consume/corrupt those authentication parameters.
   */
  let redirect=location.origin+location.pathname;

  let{data,error}=await sb.auth.signUp({
    email:e,
    password:p,
    options:{
      emailRedirectTo:redirect
    }
  });

  S.busy=false;

  if(error){
    toast(error.message);
    renderAuth();
    return;
  }

  /* If email confirmation is enabled, Supabase normally returns no session.
     Show a real dialog instead of a tiny toast so the instruction is obvious. */
  if(!data?.session){
    openVerificationDialog(e);
  }else{
    toast("Account created successfully.");

  renderAuth();
}

  let base=`

    author:profiles!posts_author_id_fkey(
      id,
      username,
      display_name,
      avatar_emoji,
      bio
    ),
    likes(user_id),
    reposts(user_id)
  `;

  let q=sb
    .from("posts")
    .select(base)
    .order("created_at",{ascending:false})
    .limit(50);

  if(S.niche?.id){
    q=q.eq("niche_id",S.niche.id);
  }else if(S.niche?.slug){
    q=q.eq("hashtag",S.niche.slug);
  }

  let{data,error}=await q;

  if(error){
    let f=sb
      .from("posts")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(50);

    if(S.niche?.slug){
      f=f.eq("hashtag",S.niche.slug);
    }

    let z=await f;

    data=await enrichPosts(z.data||[]);
  }

  S.posts=data||[];

  if(S.niche?.id&&S.posts.length===0){
    let f=await sb
      .from("posts")
      .select(base)
      .eq("hashtag",S.niche.slug)
      .order("created_at",{ascending:false})
      .limit(50);

    if(!f.error){
      S.posts=f.data||[];
    }
  }

  S.loading=false;
}

async function enrichPosts(a){
  let ids=[
    ...new Set(
      a.map(x=>x.author_id).filter(Boolean)
    )
  ];

  if(!ids.length)return a;

  let{data}=await sb
    .from("profiles")
    .select(
      "id,username,display_name,avatar_emoji,bio"
    )
    .in("id",ids);

  let m=new Map(
    (data||[]).map(x=>[x.id,x])
  );

  return a.map(x=>({
    ...x,
    author:m.get(x.author_id)||null
  }));
}

  return String(v||"")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[@4]/g,"a")
    .replace(/[3]/g,"e")
    .replace(/[1!|]/g,"i")
    .replace(/[0]/g,"o")
    .replace(/[5$]/g,"s")
    .replace(/[7]/g,"t")
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}

    new RegExp(
      "(^|\\s)"+
      w.replace(/[-\\s]/g,"\\s+")+
      "($|\\s)",
      "i"
    ).test(n)
  )||null;
}

function formatSelection(before,after,label){
  let t=document.getElementById("composer");

  if(!t)return;

  let start=t.selectionStart;
  let end=t.selectionEnd;

  let selected=t.value.slice(start,end);

  if(!selected){
    toast("Select some text first.");
    t.focus();
    return;
  }

  let replacement=before+selected+after;

  t.setRangeText(
    replacement,
    start,
    end,
    "select"
  );

  t.focus();

  preview();
}

function insertFormat(type){
  if(type==="bold"){
    formatSelection("**","**","bold");
  }else if(type==="italic"){
    formatSelection("*","*","italic");
  }else if(type==="underline"){
    formatSelection("__","__","underline");
  }else if(type==="strike"){
    formatSelection("~~","~~","strike");
  }else if(type==="code"){
    formatSelection("`","`","code");
  }
}

async function createPost(){
  let t=document.getElementById("composer");
  let b=t?.value.trim();

  if(!b)return;

  let bad=moderationMatch(b);

  if(bad){
    return toast(
      "Please remove inappropriate language before posting."
    );
  }

  let hs=tags(b);

  if(!hs.length){
    return toast(
      "Add a hashtag such as #football."
    );
  }

  let btn=document.getElementById("postbtn");

  if(btn)btn.disabled=true;

  let{error}=await sb
    .from("posts")
    .insert({
      author_id:S.user.id,
      body:b,
      hashtag:hs[0]
    });

  if(error){
    toast(error.message);
  }else{
    t.value="";
    toast("Posted!");
    await refresh();
  }

  if(btn)btn.disabled=false;

  preview();
}

function preview(){
  let t=document.getElementById("composer");
  let p=document.getElementById("tags");
  let c=document.getElementById("count");
  let b=document.getElementById("postbtn");
  let m=document.getElementById("moderation");

  if(!t)return;

  let h=tags(t.value);
  let bad=moderationMatch(t.value);

  p.innerHTML=
    h.map(x=>
      `<span class="tag">#${esc(x)}</span>`
    ).join("")
    ||
    `<span style="color:var(--muted);font-size:12px">
      Add #topic
    </span>`;

  c.textContent=t.value.length+"/500";

  b.disabled=
    !t.value.trim()||
    !h.length||
    !!bad;

  if(m){
    m.innerHTML=
      bad
      ? `<div class="moderation-warning">
          This post contains language that isn't allowed on NICHE.
          Remove it before posting.
        </div>`
      : (
          t.value.trim()
          ? `<div class="moderation-ok">
              ✓ No blocked language detected
            </div>`
          : ""
        );
  }
}

function liked(p){
  return!!p.likes?.some(
    x=>x.user_id===S.user.id
  );
}

function reposted(p){
  return!!p.reposts?.some(
    x=>x.user_id===S.user.id
  );
}

async function like(id){
  let p=S.posts.find(x=>x.id===id);

  if(!p)return;

  let r=liked(p);

  let q=r
    ?sb.from("likes")
      .delete()
      .eq("post_id",id)
      .eq("user_id",S.user.id)
    :sb.from("likes")
      .insert({
        post_id:id,
        user_id:S.user.id
      });

  let{error}=await q;

  if(error){
    toast(error.message);
  }else{
    refresh();
  }
}

async function repost(id){
  let p=S.posts.find(x=>x.id===id);

  if(!p)return;

  let r=reposted(p);

  let q=r
    ?sb.from("reposts")
      .delete()
      .eq("post_id",id)
      .eq("user_id",S.user.id)
    :sb.from("reposts")
      .insert({
        post_id:id,
        user_id:S.user.id
      });

  let{error}=await q;

  if(error){
    console.error("Repost failed",error);
    toast("Repost failed: "+error.message);
    return;
  }

  if(p.reposts){
    if(r){
      p.reposts=p.reposts.filter(
        x=>x.user_id!==S.user.id
      );
    }else{
      p.reposts=[
        ...(p.reposts||[]),
        {user_id:S.user.id}
      ];
    }
  }

  render();
}

async function loadComments(id){
  if(!S.commentOpen[id])return;

  let{data,error}=await sb
    .from("comments")
    .select(`
      *,
      author:profiles!comments_author_id_fkey(
        id,
        username,
        display_name,
        avatar_emoji
      )
    `)
    .eq("post_id",id)
    .order("created_at",{ascending:true})
    .limit(100);

  if(error){
    let f=await sb
      .from("comments")
      .select("*")
      .eq("post_id",id)
      .order("created_at",{ascending:true})
      .limit(100);

    data=await enrichComments(f.data||[]);
  }

  S.comments[id]=data||[];

  updateCommentsHost(id);
  updateCommentCount(id);
}

async function enrichComments(a){
  let ids=[
    ...new Set(
      a.map(x=>x.author_id).filter(Boolean)
    )
  ];

  if(!ids.length)return a;

  let{data}=await sb
    .from("profiles")
    .select(
      "id,username,display_name,avatar_emoji"
    )
    .in("id",ids);

  let m=new Map(
    (data||[]).map(x=>[x.id,x])
  );

  return a.map(x=>({
    ...x,
    author:m.get(x.author_id)||null
  }));
}

async function deleteComment(id){
  let c=S.comments[id]?.find(
    x=>x.id===id
  );

  if(!c||c.author_id!==S.user.id)return;

  openModal(
    "Delete comment?",
    "This comment will be permanently removed.",
    async()=>{
      let{error}=await sb
        .from("comments")
        .delete()
        .eq("id",id)
        .eq("author_id",S.user.id);

      if(error){
        toast(error.message);
        return;
      }

      S.comments[c.post_id]=
        (S.comments[c.post_id]||[])
        .filter(x=>x.id!==id);

      closeModal();

      updateCommentsHost(c.post_id);
      updateCommentCount(c.post_id);

      toast("Comment deleted");
    }
  );
}

      await navigator.share({

function bodyHTML(text){
  if(!text) return "";

  let out=esc(text);

  out=out.replace(
    /\*\*(.+?)\*\*/gs,
    "<strong>$1</strong>"
  );

  out=out.replace(
    /~~(.+?)~~/gs,
    "<s>$1</s>"
  );

  out=out.replace(
    /__([^_\n]+?)__/g,
    "<u>$1</u>"
  );

  out=out.replace(
    /(?<!\*)\*([^*\n]+?)\*(?!\*)/g,
    "<em>$1</em>"
  );

  out=out.replace(
    /`([^`\n]+?)`/g,
    "<code>$1</code>"
  );

  out=out.replace(
    /#([a-zA-Z0-9_-]+)/g,
    (match,tag)=>{
      const t=topic(tag);
      const href=hrefN(t);

      return `<a class="hashtag" href="${hrefN(t)}" onclick="event.preventDefault();nav('/niche/${encodeURIComponent(t)}')">#${esc(t)}</a>`;
    }
  );

  return out.replace(/\r?\n/g,"<br>");
}

  }else{

function profileFollowButton(p){
  if(!p || p.id===S.user.id){
    return "";
  }

  const f=isFollowingUser(p.id);

  return`
    <button
      class="${f?"secondary":"primary"}"
      onclick="toggleUserFollow('${esc(p.id)}')"
    >
      ${f?"Following":"Follow"}
    </button>
  `;
}

async function getUserFollowCounts(userId){
  if(!userId){
    return{
      followers:0,
      following:0
    };
  }

  const[
    followersResult,
    followingResult
  ]=await Promise.all([

    sb
      .from("user_follows")
      .select("*",{count:"exact",head:true})
      .eq("following_id",userId),

    sb
      .from("user_follows")
      .select("*",{count:"exact",head:true})
      .eq("follower_id",userId)

  ]);

  if(followersResult.error){
    console.error(
      "Followers count error:",
      followersResult.error
    );
  }

  if(followingResult.error){
    console.error(
      "Following count error:",
      followingResult.error
    );
  }

  return{
    followers:followersResult.count||0,
    following:followingResult.count||0
  };
}

async function loadFollowCounts(userId){
  const counts=await getUserFollowCounts(userId);

  if(!S.followCounts){
    S.followCounts={};
  }

  S.followCounts[userId]=counts;

  return counts;
}

function isFollowingUser(id){
  return!!id&&S.followingUserIds.has(id);
}

async function toggleUserFollow(id){
  if(!id||id===S.user.id){
    return;
  }

  const following=isFollowingUser(id);

  if(following){

    const{error}=await sb
      .from("user_follows")
      .delete()
      .eq("follower_id",S.user.id)
      .eq("following_id",id);

    if(error){
      console.error(
        "Unfollow failed:",
        error
      );

      toast(
        "Unfollow failed: "+
        error.message
      );

      return;
    }

    S.followingUserIds.delete(id);

    toast("Unfollowed");

  }else{

    const{error}=await sb
      .from("user_follows")
      .insert({
        follower_id:S.user.id,
        following_id:id
      });

    if(error){
      console.error(
        "Follow failed:",
        error
      );

      toast(
        "Follow failed: "+
        error.message
      );

      return;
    }

    S.followingUserIds.add(id);

    toast("Following");
  }

  await loadFollowCounts(id);

  /*
   * Also refresh the current user's following count.
   */
  await loadFollowCounts(S.user.id);

  await render();
}

async function exploreSearch(v){

    .trim()
    .replace(/^#/,"")

    S.results=[];
    render();
    return;
  }

  let[n,p]=await Promise.all([

    sb
      .from("niches")
      .select("*")
      .ilike("slug",`%${q}%`)
      .limit(20),

    sb
      .from("profiles")
      .select(
        "id,username,display_name,avatar_emoji,bio"
      )
      .ilike("username",`%${q}%`)
      .limit(20)

  ]);

  S.results=[
    ...(n.data||[]).map(x=>({
      t:"n",
      x
    })),

    ...(p.data||[]).map(x=>({
      t:"p",
      x
    }))
  ];

  render();
}

async function loadFollowingNiches(){
  S.followingNiches=[];

  /*
   * Don't reset followingUserIds here.
   * The user-follow system loads that separately.
   */
  if(!S.user)return;

  let{data,error}=await sb
    .from("niche_followers")
    .select(
      "niche_id,niches(id,slug,name,description)"
    )
    .eq("user_id",S.user.id)
    .order("created_at",{ascending:false})
    .limit(8);

  if(!error&&data){
    S.followingNiches=
      data
        .map(x=>x.niches||x.niche)
        .filter(Boolean);

    return;
  }

  let{data:rows}=await sb
    .from("niche_followers")
    .select("niche_id")
    .eq("user_id",S.user.id)
    .limit(8);

  if(!rows?.length)return;

  let ids=rows
    .map(x=>x.niche_id)
    .filter(Boolean);

  let{data:niches}=await sb
    .from("niches")
    .select(
      "id,slug,name,description"
    )
    .in("id",ids);

  S.followingNiches=niches||[];
}

async function loadFollowingPeople(userId){
  if(!userId){
    S.followingUserIds=new Set();
    S.followingPeople=[];
    return[];
  }

  /*
   * IMPORTANT:
   *
   * We intentionally do NOT do:
   *
   * profiles!user_follows_following_id_fkey
   *
   * because your database does not have that
   * foreign-key relationship.
   */

  const{data,error}=await sb
    .from("user_follows")
    .select("following_id")
    .eq("follower_id",userId)
    .limit(100);

  if(error){
    console.error(
      "Following people unavailable:",
      error
    );

    S.followingUserIds=new Set();
    S.followingPeople=[];

    return[];
  }

  const ids=(data||[])
    .map(x=>x.following_id)
    .filter(Boolean);

  if(userId===S.user.id){
    S.followingUserIds=new Set(ids);
  }

  if(!ids.length){
    S.followingPeople=[];
    return[];
  }

  const{
    data:profiles,
    error:profileError
  }=await sb
    .from("profiles")
    .select(
      "id,username,display_name,avatar_emoji,bio"
    )
    .in("id",ids);

  if(profileError){
    console.error(
      "Following profiles unavailable:",
      profileError
    );

    S.followingPeople=[];

    return[];
  }

  S.followingPeople=profiles||[];

  return S.followingPeople;
}

function isFollowingUser(id){
  return!!id&&S.followingUserIds.has(id);
}

async function saveNewPassword(){
  let a=
    document.getElementById("new-password")
    ?.value||"";

  let b=
    document.getElementById("new-password-2")
    ?.value||"";

  if(a.length<6){
    return toast(
      "Password must contain at least 6 characters."
    );
  }

  if(a!==b){
    return toast(
      "The passwords do not match."
    );
  }

  let btn=
    document.getElementById("reset-submit");

  if(btn){
    btn.disabled=true;
    btn.textContent="Updating...";
  }

  let{error}=await sb.auth.updateUser({
    password:a
  });

  if(error){

    if(btn){
      btn.disabled=false;
      btn.textContent="Set new password";
    }

    toast(error.message);

    return;
  }

  toast(
    "Password updated successfully."
  );

  setTimeout(
    ()=>leaveRecovery(),
    700
  );
}

  history.replaceState(

    "",

  S.notificationsOpen=false;

async function loadNotifications(){
  if(
    !S.user||
    S.notificationsLoading
  ){
    return;
  }

  S.notificationsLoading=true;
  S.notificationsError="";

  try{

    let{
      data:myPosts,
      error:postError
    }=await sb
      .from("posts")
      .select(
        "id,body,created_at"
      )
      .eq("author_id",S.user.id)
      .order("created_at",{ascending:false})
      .limit(40);

    if(postError){
      throw postError;
    }

    let ids=(myPosts||[]).map(
      x=>x.id
    );

    if(!ids.length){
      S.notifications=[];
      S.notificationsLoaded=true;
      return;
    }

    let[
      likesRes,
      commentsRes,
      repostsRes
    ]=await Promise.all([

      sb
        .from("likes")
        .select(
          "post_id,user_id,created_at"
        )
        .in("post_id",ids)
        .neq("user_id",S.user.id)
        .order("created_at",{ascending:false})
        .limit(30),

      sb
        .from("comments")
        .select(
          "post_id,author_id,body,created_at"
        )
        .in("post_id",ids)
        .neq("author_id",S.user.id)
        .order("created_at",{ascending:false})
        .limit(30),

      sb
        .from("reposts")
        .select(
          "post_id,user_id,created_at"
        )
        .in("post_id",ids)
        .neq("user_id",S.user.id)
        .order("created_at",{ascending:false})
        .limit(30)

    ]);

    let actorIds=[
      ...(likesRes.data||[])
        .map(x=>x.user_id),

      ...(commentsRes.data||[])
        .map(x=>x.author_id),

      ...(repostsRes.data||[])
        .map(x=>x.user_id)
    ];

    let actors=[];

    if(actorIds.length){

      let{data}=await sb
        .from("profiles")
        .select(
          "id,username,display_name,avatar_emoji"
        )
        .in(
          "id",
          [...new Set(actorIds)]
        );

      actors=data||[];
    }

    let amap=new Map(
      actors.map(x=>[x.id,x])
    );

    let pmap=new Map(
      (myPosts||[]).map(x=>[x.id,x])
    );

    S.notifications=[];

    for(
      const x of likesRes.data||[]
    ){
      S.notifications.push({
        kind:"like",
        actor:amap.get(x.user_id),
        post:pmap.get(x.post_id),
        time:x.created_at
      });
    }

    for(
      const x of commentsRes.data||[]
    ){
      S.notifications.push({
        kind:"comment",
        actor:amap.get(x.author_id),
        post:pmap.get(x.post_id),
        body:x.body,
        time:x.created_at
      });
    }

    for(
      const x of repostsRes.data||[]
    ){
      S.notifications.push({
        kind:"repost",
        actor:amap.get(x.user_id),
        post:pmap.get(x.post_id),
        time:x.created_at
      });
    }

    S.notifications.sort(
      (a,b)=>
        new Date(b.time)-
        new Date(a.time)
    );

    S.notifications=
      S.notifications.slice(0,30);

    S.notificationsLoaded=true;

  }catch(e){

    console.error(
      "Notification load failed",
      e
    );

    S.notificationsError=
      "Notifications could not be loaded right now.";

    S.notificationsLoaded=true;

  }finally{

    S.notificationsLoading=false;

    notificationPanel();
    updateNotificationButtons();
  }
}

function notificationText(n){
  const name=
    esc(
      n.actor?.display_name||
      n.actor?.username||
      "Someone"
    );

  if(n.kind==="like"){
    return`<b>${name}</b> liked your post.`;
  }

  if(n.kind==="comment"){
    return`
      <b>${name}</b>
      commented on your post
      ${n.body
        ? `: <span>${esc(n.body).slice(0,120)}</span>`
        :""
      }.
    `;
  }

  if(n.kind==="repost"){
    return`<b>${name}</b> reposted your post.`;
  }

  return`<b>${name}</b> interacted with your post.`;
}

function notificationReadKey(){
  return"niche-notifications-read-"+
    (S.user?.id||"");
}

function notificationReadAt(){
  return Number(
    localStorage.getItem(
      notificationReadKey()
    )||0
  );
}

function unreadCount(){
  let t=notificationReadAt();

  return S.notifications.filter(
    x=>
      new Date(x.time).getTime()>t
  ).length;
}

function notificationPanel(){
  let root=
    document.getElementById(
      "notification-portal"
    );

  if(!root)return;

  let u=unreadCount();

  root.innerHTML=
    S.notificationsOpen
    ? `
      <div
        class="notif-menu"
        role="dialog"
        aria-label="Notifications"
      >

        <div class="notif-head">

          <strong>
            Notifications
          </strong>

          ${
            S.notifications.length
            ? `
              <button
                type="button"
                onclick="markNotificationsRead()"
              >
                Mark all read
              </button>
            `
            :""
          }

        </div>

        <div class="notif-list">

          ${
            S.notificationsLoading
            ? `
              <div class="notif-empty">
                Loading notifications…
              </div>
            `
            : S.notificationsError
              ? `
                <div class="notif-empty">

                  ${esc(S.notificationsError)}

                  <button
                    class="secondary"
                    style="
                      margin-top:10px;
                      font-size:11px
                    "
                    onclick="
                      S.notificationsLoaded=false;
                      loadNotifications()
                    "
                  >
                    Try again
                  </button>

                </div>
              `
              : S.notifications.length
                ? S.notifications.map(n=>`
                    <a
                      class="notification"
                      href="${hrefPost(n.post?.id||"")}"
                      onclick="
                        event.preventDefault();
                        S.notificationsOpen=false;
                        notificationPanel();
                        nav('/post/${encodeURIComponent(n.post?.id||"")}')
                      "
                    >

                      <div class="avatar">
                        ${esc(n.actor?.avatar_emoji||"🙂")}
                      </div>

                      <div class="notification-text">

                        ${notificationText(n)}

                        <span class="notification-time">
                          ${esc(time(n.time))}
                        </span>

                      </div>

                    </a>
                  `).join("")
                : `
                  <div class="notif-empty">
                    No notifications yet.
                  </div>
                `
          }

        </div>
      </div>
    `
    :"";

  updateNotificationButtons();
}

async function toggleNotifications(e){
  if(e){
    e.preventDefault();
    e.stopPropagation();
  }

  S.notificationsOpen=
    !S.notificationsOpen;

  notificationPanel();
  updateNotificationButtons();

  if(
    S.notificationsOpen&&
    !S.notificationsLoaded
  ){
    await loadNotifications();
  }
}

function closeNotifications(){
  if(!S.notificationsOpen)return;

  S.notificationsOpen=false;

  notificationPanel();
}

function markNotificationsRead(){
  localStorage.setItem(
    notificationReadKey(),
    String(Date.now())
  );

  S.notificationsOpen=false;

  notificationPanel();
  updateNotificationButtons();
}

function updateNotificationButtons(){
  document
    .querySelectorAll(".notif")
    .forEach(b=>{

      let u=unreadCount();

      b.innerHTML=
        (S.notificationsOpen
          ?"✕"
          :"🔔")+
        (
          u
          ? `
            <span class="notif-badge">
              ${u>9?"9+":u}
            </span>
          `
          :""
        );

      b.setAttribute(
        "aria-expanded",
        S.notificationsOpen
      );
    });
}

function notificationMenu(){
  let u=unreadCount();

  return`
    <div class="notif-wrap">

      <button
        id="notification-button"
        class="notif"
        type="button"
        onclick="toggleNotifications(event)"
        title="Notifications"
        aria-expanded="${S.notificationsOpen}"
      >

        ${S.notificationsOpen?"✕":"🔔"}

        ${
          u
          ? `
            <span class="notif-badge">

          `
          :""
        }

}

/* =========================================================
   REFRESH / RENDER
   ========================================================= */

async function refresh(){
  let r=route();

  if(r.type==="niche"){

    await loadNiche(r.topic);
    await loadFollow();
    await loadPosts();

  }else if(r.type==="profile"){

    await loadPublicProfile(
      r.username
    );

    if(S.publicProfile){

      S.posts=await profilePosts(
        S.publicProfile.id
      );

      await loadFollowCounts(
        S.publicProfile.id
      );

    }else{

      S.posts=[];

    }

  }else{

    S.niche=null;
    S.publicProfile=null;

    await loadPosts();
  }

  render();
}

async function render(){

  applyTheme();

  if(isRecoveryRoute()){

    if(!S.session){

      document.getElementById("app").innerHTML=`
        <div class="auth">

          <div class="authbox">

            <div class="authlogo">
              NICHE
            </div>

            <div class="tagline">
              Password reset
            </div>

            <div class="authcard">

              <h3>
                Reset link expired
              </h3>

              <p style="color:var(--muted);font-size:12px">
                The secure reset session could not be established.
                Please request a new password reset email.
              </p>

              <button
                class="primary"
                onclick="
                  history.replaceState({},"",location.pathname);
                  render()
                "
              >
                Return to login
              </button>

            </div>

          </div>

        </div>
      `;

      return;
    }

    renderPasswordReset();

    return;
  }

  if(!S.session){
    renderAuth();
    return;
  }

  if(needSetup()){
    renderSetup();
    return;
  }

  /*
   * Load current user's following data.
   *
   * loadFollowingNiches() no longer resets
   * followingUserIds.
   */
  await loadFollowingNiches();

  await loadFollowingPeople(
    S.user.id
  );

  if(!S.notificationsLoaded){
    await loadNotifications();
  }

  let r=route();

  if(r.type==="niche"){

    S.search="#"+r.topic;

    await loadNiche(r.topic);
    await loadFollow();
    await loadPosts();

    document.getElementById("app").innerHTML=
      layout(nichePage());

  }else if(r.type==="profile"){

    S.search="";

    await loadPublicProfile(
      r.username
    );

    if(S.publicProfile){

      S.posts=await profilePosts(
        S.publicProfile.id
      );

      await loadFollowCounts(
        S.publicProfile.id
      );

    }else{

      S.posts=[];

    }

    document.getElementById("app").innerHTML=
      layout(profilePage());

  }else if(r.type==="explore"){

    document.getElementById("app").innerHTML=
      layout(explore());

  }else if(r.type==="settings"){

    document.getElementById("app").innerHTML=
      layout(settings());

  }else if(r.type==="profile-edit"){

    S.search="";

    renderEditProfile();

  }else if(r.type==="post"){

    await loadPosts();

    document.getElementById("app").innerHTML=
      layout(home());

    setTimeout(
      ()=>{
        document
          .getElementById(
            "post-"+CSS.escape(r.id)
          )
          ?.scrollIntoView({
            behavior:"smooth",
            block:"center"
          });
      },
      50
    );

  }else{

    S.search="";
    S.niche=null;
    S.publicProfile=null;

    await loadPosts();

    document.getElementById("app").innerHTML=
      layout(home());
  }
}

/* =========================================================
   AUTH CALLBACK / INIT
   ========================================================= */

async function prepareAuthCallback(){
  /* Supabase can return a PKCE code in the query string. Exchange it before
     the first render so the app never briefly falls back to the login screen. */
  let params=new URLSearchParams(location.search);
  let code=params.get("code");

  if(code){
    let{error}=await sb.auth.exchangeCodeForSession(code);

    if(error){
      console.error("NICHE auth callback:",error);
    }else{
      params.delete("code");
      let clean=params.toString();
      history.replaceState({},"",location.pathname+(clean?"?"+clean:""));
    }
  }
}

/* =========================================================
   INIT
   ========================================================= */

async function init(){

  applyTheme();

  renderModal();
  notificationPanel();

  await prepareAuthCallback();

  let{data}=await sb.auth.getSession();

  S.session=data.session;
  S.user=data.session?.user||null;

  if(S.user){
    await loadProfile();
  }

  await render();

  notificationPanel();

  sb.auth.onAuthStateChange(
    async(event,session)=>{

      S.session=session;
      S.user=session?.user||null;

      if(event!=="PASSWORD_RECOVERY"){

        S.notifications=[];
        S.notificationsLoaded=false;
        S.followingNiches=[];
        S.followingPeople=[];
        S.followingUserIds=new Set();
        S.followCounts={};

      }

      if(S.user){
        S.verificationDialog=null;
        await loadProfile();

        /* Start a fresh setup draft only when there is no draft already.
           This keeps typed profile fields intact if auth state changes. */
        if(!S.profile?.username && !S.setupDraft){
          S.setupDraft={
            username:"",
            displayName:S.profile?.display_name||"",
            bio:S.profile?.bio||"",
            avatar:S.profile?.avatar_emoji||"🙂"
          };
        }
      }else{
        S.profile=null;
        S.setupDraft=null;
      }

      await render();

      notificationPanel();
    }
  );

  sb.channel("niche-v2")

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      refresh
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"likes"
      },
      refresh
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"reposts"
      },
      refresh
    )

    .subscribe();
}
/* =========================================================
   NICHE POSTING / COMMENTING PIN
   Paste this block immediately BEFORE the final init();
   ========================================================= */

(function(){

  const PIN_ENABLED_KEY="niche-posting-pin-enabled";
  const PIN_HASH_KEY="niche-posting-pin-hash";

  function pinKey(base){
    return base+"-"+(S.user?.id||"guest");
  }

  function pinEnabled(){
    return localStorage.getItem(
      pinKey(PIN_ENABLED_KEY)
    )==="1";
  }

  function setPinEnabled(v){
    localStorage.setItem(
      pinKey(PIN_ENABLED_KEY),
      v?"1":"0"
    );
  }

  function getPinHash(){
    return localStorage.getItem(
      pinKey(PIN_HASH_KEY)
    )||"";
  }

  async function hashPin(pin){
    const data=new TextEncoder().encode(pin);

    const hash=await crypto.subtle.digest(
      "SHA-256",
      data
    );

    return Array.from(
      new Uint8Array(hash)
    )
    .map(
      x=>x.toString(16).padStart(2,"0")
    )
    .join("");
  }

  function pinIsConfigured(){
    return !!getPinHash();
  }

  function closePinDialog(){
    document.getElementById(
      "niche-pin-dialog"
    )?.remove();
  }

  function pinDialogHTML(title,message,buttons){
    const old=document.getElementById(
      "niche-pin-dialog"
    );

    if(old)old.remove();

    const root=document.createElement("div");

    root.id="niche-pin-dialog";

    root.innerHTML=`
      <div class="modal-backdrop niche-pin-backdrop">

        <div class="modal niche-pin-modal">

          <h2>${esc(title)}</h2>

          <p>${esc(message)}</p>

          <input
            id="niche-pin-input"
            class="input"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="8"
            autocomplete="off"
            placeholder="Enter PIN"
          >

          <div
            id="niche-pin-error"
            style="
              color:var(--red);
              font-size:11px;
              margin-top:8px;
              min-height:15px
            "
          ></div>

          <div class="modal-actions">
            ${buttons}
          </div>

        </div>

      </div>
    `;

    document.body.appendChild(root);

    const input=document.getElementById(
      "niche-pin-input"
    );

    setTimeout(
      ()=>input?.focus(),
      50
    );

    input?.addEventListener(
      "keydown",
      e=>{
        if(e.key==="Enter"){
          e.preventDefault();

          document
            .getElementById("niche-pin-confirm")
            ?.click();
        }

        if(e.key==="Escape"){
          closePinDialog();
        }
      }
    );
  }

  async function verifyPinDialog(){
    const input=document.getElementById(
      "niche-pin-input"
    );

    const error=document.getElementById(
      "niche-pin-error"
    );

    const pin=input?.value||"";

    if(!/^\d{4,8}$/.test(pin)){
      if(error){
        error.textContent=
          "PIN must contain 4–8 digits.";
      }

      input?.focus();

      return false;
    }

    const saved=getPinHash();

    if(!saved){
      closePinDialog();
      return true;
    }

    const hash=await hashPin(pin);

    if(hash!==saved){

      if(error){
        error.textContent=
          "Incorrect PIN.";
      }

      input.value="";
      input.focus();

      return false;
    }

    closePinDialog();

    return true;
  }

  async function askForPin(action){

    if(!pinEnabled()||!pinIsConfigured()){
      await action();
      return;
    }

    pinDialogHTML(
      "PIN required",
      "Enter your PIN to continue.",
      `
        <button
          class="secondary"
          type="button"
          onclick="window.__nicheCancelPin()"
        >
          Cancel
        </button>

        <button
          id="niche-pin-confirm"
          class="primary"
          type="button"
        >
          Continue
        </button>
      `
    );

    window.__nicheCancelPin=()=>{
      closePinDialog();
    };

    document
      .getElementById("niche-pin-confirm")
      ?.addEventListener(
        "click",
        async()=>{
          const ok=
            await verifyPinDialog();

          if(ok){
            await action();
          }
        }
      );
  }

  async function createPin(){

    const input=document.getElementById(
      "niche-pin-input"
    );

    const error=document.getElementById(
      "niche-pin-error"
    );

    const pin=input?.value||"";

    if(!/^\d{4,8}$/.test(pin)){

      if(error){
        error.textContent=
          "PIN must contain 4–8 digits.";
      }

      return;
    }

    closePinDialog();

    pinDialogHTML(
      "Confirm PIN",
      "Enter the same PIN again.",
      `
        <button
          class="secondary"
          type="button"
          onclick="window.__nicheCancelPin()"
        >
          Cancel
        </button>

        <button
          id="niche-pin-confirm"
          class="primary"
          type="button"
        >
          Confirm
        </button>
      `
    );

    window.__nicheCancelPin=()=>{
      closePinDialog();
    };

    const confirmButton=
      document.getElementById(
        "niche-pin-confirm"
      );

    confirmButton?.addEventListener(
      "click",
      async()=>{

        const confirmInput=
          document.getElementById(
            "niche-pin-input"
          );

        const confirmPin=
          confirmInput?.value||"";

        if(confirmPin!==pin){

          const error=
            document.getElementById(
              "niche-pin-error"
            );

          if(error){
            error.textContent=
              "PINs do not match.";
          }

          confirmInput.value="";
          confirmInput.focus();

          return;
        }

        const hash=
          await hashPin(pin);

        localStorage.setItem(
          pinKey(PIN_HASH_KEY),
          hash
        );

        setPinEnabled(true);

        closePinDialog();

        toast(
          "Posting PIN enabled."
        );

        render();
      }
    );
  }

  function setupPin(){

    pinDialogHTML(
      "Set up Posting PIN",
      "Create a 4–8 digit PIN. It will be required before posting or commenting.",
      `
        <button
          class="secondary"
          type="button"
          onclick="window.__nicheCancelPin()"
        >
          Cancel
        </button>

        <button
          id="niche-pin-confirm"
          class="primary"
          type="button"
        >
          Continue
        </button>
      `
    );

    window.__nicheCancelPin=()=>{
      closePinDialog();
    };

    document
      .getElementById("niche-pin-confirm")
      ?.addEventListener(
        "click",
        createPin
      );
  }

  async function changePin(){

    if(!pinIsConfigured()){
      setupPin();
      return;
    }

    pinDialogHTML(
      "Current PIN",
      "Enter your current PIN before changing it.",
      `
        <button
          class="secondary"
          type="button"
          onclick="window.__nicheCancelPin()"
        >
          Cancel
        </button>

        <button
          id="niche-pin-confirm"
          class="primary"
          type="button"
        >
          Continue
        </button>
      `
    );

    window.__nicheCancelPin=()=>{
      closePinDialog();
    };

    document
      .getElementById("niche-pin-confirm")
      ?.addEventListener(
        "click",
        async()=>{

          const ok=
            await verifyPinDialog();

          if(ok){
            setupPin();
          }
        }
      );
  }

  async function disablePin(){

    if(!pinIsConfigured()){
      setPinEnabled(false);
      render();
      return;
    }

    pinDialogHTML(
      "Disable Posting PIN",
      "Enter your current PIN to disable PIN protection.",
      `
        <button
          class="secondary"
          type="button"
          onclick="window.__nicheCancelPin()"
        >
          Cancel
        </button>

        <button
          id="niche-pin-confirm"
          class="danger"
          type="button"
        >
          Disable
        </button>
      `
    );

    window.__nicheCancelPin=()=>{
      closePinDialog();
    };

    document
      .getElementById("niche-pin-confirm")
      ?.addEventListener(
        "click",
        async()=>{

          const ok=
            await verifyPinDialog();

          if(!ok)return;

          localStorage.removeItem(
            pinKey(PIN_HASH_KEY)
          );

          setPinEnabled(false);

          toast(
            "Posting PIN disabled."
          );

          render();
        }
      );
  }

  /*
   * Add the PIN section to the existing Security
   * section without replacing the existing settings.
   */

  const originalSettings=settings;

  settings=function(){

    let html=originalSettings();

    const pinSection=`
      <section class="setting-section">

        <h1>Posting PIN</h1>

        <p>
          Require a PIN before sending posts or comments.
          The PIN is stored only on this browser.
        </p>

        <div class="activity-row">

          <div>

            <b style="font-size:13px">
              ${
                pinEnabled()
                ?"PIN protection on"
                :"PIN protection off"
              }
            </b>

            <div
              style="
                color:var(--muted);
                font-size:11px;
                margin-top:3px
              "
            >
              ${
                pinEnabled()
                ?"A PIN is required before posting or commenting."
                :"Posts and comments do not require a PIN."
              }
            </div>

          </div>

          <button
            class="switch-control ${
              pinEnabled()?"on":""
            }"
            onclick="
              ${
                pinEnabled()
                ?"window.__nicheDisablePin()"
                :"window.__nicheSetupPin()"
              }
            "
          >
            <span class="switch-knob"></span>
          </button>

        </div>

        ${
          pinEnabled()
          ? `
            <div style="margin-top:12px">

              <button
                class="secondary"
                onclick="window.__nicheChangePin()"
              >
                Change PIN
              </button>

            </div>
          `
          :""
        }

      </section>
    `;

    const marker=
      `<section class="setting-section">

        <h1>Account</h1>`;

    if(html.includes(marker)){
      html=html.replace(
        marker,
        pinSection+marker
      );
    }else{
      html=html.replace(
        "</div>\n  `;",
        pinSection+"</div>\n  `;"
      );
    }

    return html;
  };

  window.__nicheSetupPin=setupPin;
  window.__nicheChangePin=changePin;
  window.__nicheDisablePin=disablePin;

  /*
   * Protect the existing createPost() function.
   *
   * The original function is left completely untouched.
   */

  const originalCreatePost=
    window.createPost;

  window.createPost=
    async function(){

      if(
        pinEnabled()&&
        pinIsConfigured()
      ){

        await askForPin(
          async()=>{
            await originalCreatePost();
          }
        );

        return;
      }

      await originalCreatePost();
    };

  /*
   * Protect the existing sendComment() function.
   */

  const originalSendComment=
    window.sendComment;

  window.sendComment=
    async function(id){

      if(
        pinEnabled()&&
        pinIsConfigured()
      ){

        await askForPin(
          async()=>{
            await originalSendComment(id);
          }
        );

        return;
      }

      await originalSendComment(id);
    };

  /*
   * Small amount of styling for the PIN dialog.
   */

  const style=document.createElement("style");

  style.textContent=`

    .niche-pin-backdrop{
      z-index:1000;
    }

    .niche-pin-modal{
      width:min(390px,calc(100vw - 30px));
    }

    .niche-pin-modal .input{
      width:100%;
      margin-top:10px;
      text-align:center;
      letter-spacing:.3em;
      font-size:20px;
    }

    .niche-pin-modal .modal-actions{
      margin-top:14px;
    }

  `;

  document.head.appendChild(style);

})();
init();
</script>

</body>
</html>
