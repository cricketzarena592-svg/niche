<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niche</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#17191c;--muted:#747b84;--line:#e4e7eb;--soft:#f0f2f5;--blue:#2563eb;--red:#ef4444}
[data-theme=dark]{--bg:#0d0f12;--card:#15181c;--text:#f4f5f7;--muted:#9299a3;--line:#292e35;--soft:#1d2127;--blue:#5b8cff;--red:#ff6666}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:220px 1fr 260px;min-height:100vh}.side,.right{background:var(--card);border-color:var(--line)}.side{border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh}.logo{font-size:28px;font-weight:800;padding:0 12px 25px;cursor:pointer}.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:var(--muted);padding:12px;border-radius:10px;text-align:left;font-weight:650}.nav button:hover,.nav button.active{background:var(--soft);color:var(--text)}.nav span{display:inline-block;width:25px}.mini{position:absolute;bottom:18px;left:12px;right:12px;background:var(--soft);padding:9px;border-radius:12px;display:flex;gap:9px;align-items:center;cursor:pointer}.avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}.avatar.big{width:76px;height:76px;font-size:40px}.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:12px}.main{min-width:0}.top{height:70px;position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 22px}.top h1{font-size:20px;margin:0;flex:1}.icon{border:0;background:none;color:var(--muted);font-size:20px;width:40px;height:40px;border-radius:9px}.icon:hover{background:var(--soft);color:var(--text)}.primary{border:0;background:var(--blue);color:white;padding:10px 15px;border-radius:10px;font-weight:700}.content{max-width:760px;margin:auto;padding:22px}.search,.field input,.field textarea,.field select,.chat-input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:12px;outline:none}.search:focus,.field input:focus,.field textarea:focus,.chat-input:focus{border-color:var(--blue)}.composer,.post,.profile,.nichehero{background:var(--card);border:1px solid var(--line);border-radius:16px}.composer{display:flex;gap:10px;padding:13px;margin:15px 0}.composer textarea{flex:1;border:0;background:none;color:var(--text);outline:0;resize:none;padding:10px}.post{padding:16px;margin:13px 0}.posthead{display:flex;gap:10px;align-items:center}.postname{font-weight:700}.menu{margin-left:auto;position:relative}.menu>button{border:0;background:none;color:var(--muted);font-size:20px}.pop{display:none;position:absolute;right:0;top:30px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:10px;z-index:10;box-shadow:0 10px 30px #0002}.pop.show{display:block}.pop button{display:block;width:130px;text-align:left;border:0;background:none;color:var(--text);padding:9px;border-radius:7px}.pop button:hover{background:var(--soft)}.danger{color:var(--red)!important}.posttext{white-space:pre-wrap;line-height:1.55;margin:14px 0}.tag{color:var(--blue);font-weight:700}.actions{border-top:1px solid var(--line);padding-top:8px;display:flex;gap:4px}.action{border:0;background:none;color:var(--muted);padding:8px 10px;border-radius:8px}.action:hover{background:var(--soft);color:var(--text)}.liked{color:var(--red)!important}.comments{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.comment{padding:6px 0;font-size:13px}.commentform{display:flex;gap:6px}.commentform input{flex:1;background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px;outline:0}.right{border-left:1px solid var(--line);padding:22px}.right h3{font-size:14px}.row{display:flex;gap:9px;align-items:center;padding:9px 5px;border-radius:10px;cursor:pointer}.row:hover{background:var(--soft)}.row .grow{min-width:0}.follow{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 9px;font-size:12px;font-weight:700}.follow.on{background:var(--text);color:var(--card)}.profile{padding:22px}.profiletop{display:flex;align-items:center;gap:16px}.stats{display:flex;gap:28px;margin-top:20px}.stats b,.stats span{display:block}.stats span{font-size:12px;color:var(--muted)}.nichehero{padding:20px;display:flex;align-items:center;gap:15px;margin-bottom:18px}.nicheemoji{font-size:45px}.empty{text-align:center;color:var(--muted);padding:45px 15px}.modalbg{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:18px}.modalbg.show{display:flex}.modal{width:min(500px,100%);background:var(--card);border:1px solid var(--line);border-radius:17px;padding:22px}.modal h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field textarea{min-height:100px;resize:vertical}.emojis{display:flex;flex-wrap:wrap;gap:7px}.emojis button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px;font-size:20px}.emojis button.sel{outline:2px solid var(--blue)}.modalactions{display:flex;justify-content:flex-end;gap:8px}.secondary{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--card);padding:10px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
/* chat */.chat{height:calc(100vh - 70px);display:grid;grid-template-columns:280px 1fr;max-width:1050px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.chatlist{background:var(--card);border-right:1px solid var(--line);overflow:auto}.chatsearch{padding:14px;border-bottom:1px solid var(--line)}.conv{display:flex;gap:9px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.conv:hover,.conv.active{background:var(--soft)}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:var(--blue);color:#fff;border-radius:20px;padding:2px 6px;font-size:10px}.chatwindow{display:flex;flex-direction:column;min-width:0}.chathead{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:var(--card)}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:7px}.bubble{max-width:70%;padding:10px 12px;border-radius:15px;background:var(--card);border:1px solid var(--line);align-self:flex-start}.mine{align-self:flex-end;background:var(--blue);border-color:var(--blue);color:#fff}.bubble small{display:block;font-size:9px;opacity:.65;margin-top:3px}.delete-msg{cursor:pointer;margin-left:6px}.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--card)}.chatbar button{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
@media(max-width:1050px){.app{grid-template-columns:75px 1fr}.right{display:none}.logo{font-size:0;text-align:center}.logo:after{content:'N';font-size:28px}.nav button{font-size:0;text-align:center}.nav span{font-size:19px;width:auto}.mini{justify-content:center}.mini div:not(.avatar){display:none}}
@media(max-width:700px){.app{display:block}.side{position:fixed;bottom:0;top:auto;width:100%;height:62px;z-index:30;border-right:0;border-top:1px solid var(--line);padding:4px}.nav{display:flex;justify-content:space-around}.nav button{padding:9px}.mini,.logo{display:none}.main{padding-bottom:62px}.top{padding:0 10px}.content{padding:15px 10px}.chat{height:calc(100vh - 70px);grid-template-columns:1fr}.chatlist{display:none}.bubble{max-width:82%}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="logo" id="logo">Niche</div><nav class="nav"><button data-page="home"><span>⌂</span>Home</button><button data-page="explore"><span>⌕</span>Explore</button><button data-page="following"><span>★</span>Following</button><button data-page="chat"><span>◌</span>Messages</button><button data-page="profile"><span>●</span>Profile</button><button id="newNiche"><span>＋</span>Create niche</button></nav><div class="mini" id="mini"><div class="avatar" id="miniAvatar">🙂</div><div><b id="miniName">You</b><div class="muted" id="miniHandle">@you</div></div></div></aside><main class="main"><header class="top"><button class="icon" id="back">←</button><h1 id="title">Home</h1><button class="icon" id="theme">☾</button><button class="primary" id="newPost">Create post</button></header><div id="view"></div></main><aside class="right"><h3>Popular niches</h3><div id="rightNiches"></div><h3>People</h3><div id="rightPeople"></div></aside></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const K={posts:'niche4_posts',niches:'niche4_niches',follow:'niche4_follow',profile:'niche4_profile',users:'niche4_users',messages:'niche4_messages',comments:'niche4_comments',theme:'niche4_theme'};
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let profile=get(K.profile,{id:'me',username:'you',name:'You',emoji:'🙂'});
let users=get(K.users,[{id:'u1',username:'arjun',name:'Arjun',emoji:'🧑'},{id:'u2',username:'maya',name:'Maya',emoji:'👩'},{id:'u3',username:'dev',name:'Dev',emoji:'👨'},{id:'u4',username:'riya',name:'Riya',emoji:'👩‍💻'}]);
let niches=get(K.niches,[['cricket','Cricket','🏏',12400],['gaming','Gaming','🎮',9800],['programming','Programming','💻',8700],['music','Music','🎵',7600],['football','Football','⚽',6900],['movies','Movies','🎬',6100],['books','Books','📚',3900]].map(x=>({id:x[0],name:x[1],emoji:x[2],followers:x[3]})));
let posts=get(K.posts,[['u1','cricket','That last over was unbelievable! 🏏'],['u2','programming','Finally finished my first JavaScript project. 💻'],['u3','gaming','What games are everyone playing this weekend?'],['u4','books','Just started a new mystery novel. 📚']].map((x,i)=>({id:'p'+i,userId:x[0],niche:x[1],text:x[2],likes:i*7+12,liked:false,created:Date.now()-i*3600000})));
let followed=get(K.follow,['cricket','programming']);let messages=get(K.messages,[]),comments=get(K.comments,{});let theme=localStorage.getItem(K.theme)||'light';document.documentElement.dataset.theme=theme;
if(!users.some(u=>u.id==='me'))users.push(profile);else users=users.map(u=>u.id==='me'?profile:u);save();
function save(){put(K.profile,profile);put(K.users,users);put(K.niches,niches);put(K.posts,posts);put(K.follow,followed);put(K.messages,messages);put(K.comments,comments)}
let s={page:'home',niche:null,search:'',chat:null},hist=[];const $=x=>document.getElementById(x);function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function user(id){return users.find(x=>x.id===id)||{name:'Unknown',username:'unknown',emoji:'🙂'}}function niche(id){return niches.find(x=>x.id===id)}function time(t){let d=Date.now()-t;if(d<60000)return'now';if(d<3600000)return Math.floor(d/60000)+'m';if(d<86400000)return Math.floor(d/3600000)+'h';return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2200)}
const bad=['fuck','fucking','shit','bitch','asshole','dumbass'];function badText(x){return bad.some(w=>new RegExp('\\b'+w+'\\b','i').test(x))}function tags(x){return esc(x).replace(/(^|\s)(#[\w-]+)/g,'$1<span class="tag">$2</span>')}
function nav(page,o={}){hist.push({...s});s={page,niche:o.niche||null,search:o.search||'',chat:o.chat||null};render()}function postHTML(p){let u=user(p.userId),cs=comments[p.id]||[];return `<article class="post" data-post="${p.id}"><div class="posthead"><div class="avatar">${esc(u.emoji)}</div><div class="grow"><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)} · ${time(p.created)}</div></div>${p.userId==='me'?'<div class="menu"><button>⋯</button><div class="pop"><button class="delete-post danger">Delete post</button></div></div>':''}</div><div class="posttext">${tags(p.text)}</div><div class="actions"><button class="action like">♡ ${p.likes}</button><button class="action comments-toggle">◯ ${cs.length}</button><button class="action share">↗ Share</button><button class="action open-user">👤 Profile</button></div><div class="comments" style="display:none">${cs.map(c=>`<div class="comment"><b>${esc(c.user)}</b> ${esc(c.text)}</div>`).join('')}<div class="commentform"><input maxlength="300" placeholder="Write a comment..."><button class="primary send-comment">Send</button></div></div></article>`}
function postsHTML(a){return a.length?a.sort((x,y)=>y.created-x.created).map(postHTML).join(''):'<div class="empty">No posts found.</div>'}
function render(){let titles={home:'Home',explore:'Explore',following:'Following',profile:'Profile',chat:'Messages',niche:niche(s.niche)?.name||'Niche'};$('title').textContent=titles[s.page]||'Niche';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===s.page));$('miniAvatar').textContent=profile.emoji;$('miniName').textContent=profile.name;$('miniHandle').textContent='@'+profile.username;if(s.page==='home')home();else if(s.page==='explore')explore();else if(s.page==='following')following();else if(s.page==='profile')profilePage();else if(s.page==='chat')chatPage();else nichePage();right()}
function home(){let a=s.search?posts.filter(p=>(p.text+' '+p.niche+' '+user(p.userId).username).toLowerCase().includes(s.search.toLowerCase())):posts;$('view').innerHTML=`<div class="content"><input class="search" id="homeSearch" placeholder="Search posts..." value="${esc(s.search)}"><div class="composer"><div class="avatar">${esc(profile.emoji)}</div><textarea id="quick" placeholder="Share something with a niche..."></textarea><button class="primary" id="quickBtn">Post</button></div>${postsHTML(a)}</div>`}
function following(){$('view').innerHTML=`<div class="content"><h2>Following</h2>${postsHTML(posts.filter(p=>followed.includes(p.niche)))}</div>`}
function explore(){let q=s.search.toLowerCase(),ns=niches.filter(n=>(n.name+n.id).toLowerCase().includes(q)),ps=posts.filter(p=>(p.text+p.niche+user(p.userId).username).toLowerCase().includes(q));$('view').innerHTML=`<div class="content"><h2>Explore</h2><input class="search" id="exploreSearch" placeholder="Search niches or posts..." value="${esc(s.search)}"><h3>Niches</h3>${ns.map(n=>`<div class="row" data-niche="${n.id}"><div class="avatar">${n.emoji}</div><div class="grow"><b>#${esc(n.name)}</b><div class="muted">${n.followers.toLocaleString()} followers</div></div><button class="follow ${followed.includes(n.id)?'on':''}">${followed.includes(n.id)?'Following':'Follow'}</button></div>`).join('')||'<div class="empty">No niches found.</div>'}<h3>Posts</h3>${postsHTML(ps)}</div>`}
function nichePage(){let n=niche(s.niche);if(!n)return nav('explore');$('view').innerHTML=`<div class="content"><div class="nichehero"><div class="nicheemoji">${n.emoji}</div><div class="grow"><h2>#${esc(n.name)}</h2><div class="muted">${n.followers.toLocaleString()} followers</div></div><button class="follow ${followed.includes(n.id)?'on':''}" id="nfollow">${followed.includes(n.id)?'Following':'Follow'}</button></div>${postsHTML(posts.filter(p=>p.niche===n.id))}</div>`}
function profilePage(){let a=posts.filter(p=>p.userId==='me');$('view').innerHTML=`<div class="content"><div class="profile"><div class="profiletop"><div class="avatar big">${esc(profile.emoji)}</div><div class="grow"><h2>${esc(profile.name)}</h2><div class="muted">@${esc(profile.username)}</div></div><button class="secondary" id="edit">Edit profile</button></div><div class="stats"><div><b>${a.length}</b><span>Posts</span></div><div><b>${followed.length}</b><span>Niches</span></div><div><b>${users.length}</b><span>People</span></div></div></div><h3>Your posts</h3>${postsHTML(a)}</div>`}
function chatMsgs(id){return messages.filter(m=>(m.from==='me'&&m.to===id)||(m.from===id&&m.to==='me')).sort((a,b)=>a.created-b.created)}function unread(id){return messages.filter(m=>m.from===id&&m.to==='me'&&!m.read).length}function chatPage(){let people=users.filter(u=>u.id!=='me'),sel=s.chat?user(s.chat):null;let list=people.filter(u=>chatMsgs(u.id).length||u.id===s.chat).map(u=>{let a=chatMsgs(u.id),last=a[a.length-1];return `<div class="conv ${s.chat===u.id?'active':''}" data-chat="${u.id}"><div class="avatar">${u.emoji}</div><div class="grow"><b>${esc(u.name)}</b><div class="preview">${last?esc(last.text):'Start a conversation'}</div></div>${unread(u.id)?'<span class="badge">'+unread(u.id)+'</span>':''}</div>`}).join('');$('view').innerHTML=`<div class="chat"><section class="chatlist"><div class="chatsearch"><input class="search" id="peopleSearch" placeholder="Search people..."></div><div id="convList">${list}</div><div id="peopleResults">${people.map(u=>`<div class="row" data-chat="${u.id}"><div class="avatar">${u.emoji}</div><div><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)}</div></div></div>`).join('')}</div></section><section class="chatwindow">${sel?chatWindow(sel):'<div class="empty" style="margin:auto"><div style="font-size:45px">💬</div><h3>Your messages</h3><p>Choose someone to start chatting.</p></div>'}</section></div>`;if(sel){messages.forEach(m=>{if(m.from===sel.id&&m.to==='me')m.read=true});put(K.messages,messages);setTimeout(()=>{let x=$('messages');if(x)x.scrollTop=x.scrollHeight},0)}}
function chatWindow(u){let a=chatMsgs(u.id);return `<div class="chathead"><div class="avatar">${u.emoji}</div><div class="grow"><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)}</div></div><button class="icon" data-user="${u.id}">👤</button></div><div class="messages" id="messages">${a.length?a.map(m=>`<div class="bubble ${m.from==='me'?'mine':''}">${esc(m.text)}<small>${time(m.created)} ${m.from==='me'?`<span class="delete-msg" data-delmsg="${m.id}">Delete</span>`:''}</small></div>`).join(''):'<div class="empty">No messages yet.<br>Say hello!</div>'}</div><form class="chatbar" id="chatForm"><input class="chat-input" id="chatInput" maxlength="1000" placeholder="Message @${esc(u.username)}..."><button>Send</button></form>`}
function right(){$('rightNiches').innerHTML=niches.slice(0,5).map(n=>`<div class="row" data-niche="${n.id}"><div class="avatar">${n.emoji}</div><div><b>#${esc(n.name)}</b><div class="muted">${n.followers.toLocaleString()} followers</div></div></div>`).join('');$('rightPeople').innerHTML=users.filter(u=>u.id!=='me').map(u=>`<div class="row" data-chat="${u.id}"><div class="avatar">${u.emoji}</div><div><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)}</div></div></div>`).join('')}
function modal(type){let em=['🙂','😀','😎','🤓','😄','🧑','👨','👩','👨‍💻','👩‍💻','🏏','🎮','💻','🎵','⚽','🎬','📷','📚','🔥','⭐','🚀','🐱','🐶'];let m=$('modal');if(type==='post')m.innerHTML=`<h2>Create post</h2><div class="field"><label>Post</label><textarea id="postText" maxlength="1000" placeholder="What's happening?"></textarea></div><div class="field"><label>Niche</label><select id="postNiche">${niches.map(n=>`<option value="${n.id}">${n.emoji} #${esc(n.name)}</option>`).join('')}</select></div><div class="modalactions"><button class="secondary close">Cancel</button><button class="primary" id="savePost">Post</button></div>`;else if(type==='profile')m.innerHTML=`<h2>Edit profile</h2><div class="field"><label>Username</label><input id="uname" value="${esc(profile.username)}" maxlength="20"></div><div class="field"><label>Display name</label><input id="dname" value="${esc(profile.name)}" maxlength="40"></div><div class="field"><label>Profile emoji</label><div class="emojis">${em.map(e=>`<button type="button" class="${e===profile.emoji?'sel':''}" data-emoji="${e}">${e}</button>`).join('')}</div></div><div class="modalactions"><button class="secondary close">Cancel</button><button class="primary" id="saveProfile">Save</button></div>`;else m.innerHTML=`<h2>Create niche</h2><div class="field"><label>Name</label><input id="nname" maxlength="30" placeholder="Cricket"></div><div class="field"><label>Emoji</label><div class="emojis">${em.map(e=>`<button type="button" data-nemoji="${e}">${e}</button>`).join('')}</div></div><div class="field"><label>Private description</label><textarea id="ndesc" maxlength="300"></textarea></div><div class="modalactions"><button class="secondary close">Cancel</button><button class="primary" id="saveNiche">Create niche</button></div>`;$('modalbg').classList.add('show')}
function openPerson(id){let u=user(id);$('modal').innerHTML=`<div style="text-align:center"><div class="avatar big" style="margin:auto">${u.emoji}</div><h2>${esc(u.name)}</h2><p class="muted">@${esc(u.username)}</p><button class="primary" id="messagePerson">Message</button></div>`;$('modalbg').classList.add('show');$('messagePerson').onclick=()=>{$('modalbg').classList.remove('show');nav('chat',{chat:u.id})}}

document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){nav(b.dataset.page);return}if(e.target.closest('#logo')){location.reload();return}if(e.target.closest('#back')){if(hist.length)s=hist.pop();else s={page:'home',niche:null,search:'',chat:null};render();return}if(e.target.closest('#theme')){theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;localStorage.setItem(K.theme,theme);return}if(e.target.closest('#newPost')){modal('post');return}if(e.target.closest('#newNiche')){modal('niche');return}if(e.target.closest('#mini')){nav('profile');return}if(e.target.closest('#edit')){modal('profile');return}if(e.target.closest('.close')){$('modalbg').classList.remove('show');return}if(e.target.id==='modalbg'){$('modalbg').classList.remove('show');return}
let n=e.target.closest('[data-niche]');if(n&&!e.target.closest('.follow')){nav('niche',{niche:n.dataset.niche});return}if(e.target.closest('#nfollow')){toggleFollow(s.niche);return}let f=e.target.closest('.follow');if(f){let r=f.closest('[data-niche]');if(r)toggleFollow(r.dataset.niche);return}let c=e.target.closest('[data-chat]');if(c){nav('chat',{chat:c.dataset.chat});return}let du=e.target.closest('[data-user]');if(du){openPerson(du.dataset.user);return}
let pEl=e.target.closest('[data-post]');if(pEl){let p=posts.find(x=>x.id===pEl.dataset.post);if(!p)return;if(e.target.closest('.menu>button')){pEl.querySelector('.pop').classList.toggle('show');return}if(e.target.closest('.delete-post')){if(confirm('Delete this post?')){posts=posts.filter(x=>x.id!==p.id);delete comments[p.id];save();render()}return}if(e.target.closest('.like')){p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render();return}if(e.target.closest('.comments-toggle')){let x=pEl.querySelector('.comments');x.style.display=x.style.display==='none'?'block':'none';return}if(e.target.closest('.send-comment')){let input=pEl.querySelector('.commentform input'),v=input.value.trim();if(v){(comments[p.id]??=[]).push({user:profile.name,text:v});save();render()}return}if(e.target.closest('.share')){navigator.clipboard?.writeText(location.href+'#post-'+p.id);toast('Post link copied.');return}if(e.target.closest('.open-user')){openPerson(p.userId);return}}
let em=e.target.closest('[data-emoji]');if(em){document.querySelectorAll('[data-emoji]').forEach(x=>x.classList.remove('sel'));em.classList.add('sel');return}let nem=e.target.closest('[data-nemoji]');if(nem){document.querySelectorAll('[data-nemoji]').forEach(x=>x.classList.remove('sel'));nem.classList.add('sel');return}if(e.target.id==='savePost'){let v=$('postText').value.trim();if(!v){toast('Write something first.');return}if(badText(v)){toast('This post contains bad language. Please remove it to post.');return}posts.push({id:'p'+Date.now(),userId:'me',niche:$('postNiche').value,text:v,likes:0,liked:false,created:Date.now()});save();$('modalbg').classList.remove('show');render();toast('Post published.');return}if(e.target.id==='saveProfile'){let u=$('uname').value.trim().toLowerCase(),d=$('dname').value.trim();if(!/^[a-z0-9_]{3,20}$/.test(u)){toast('Username: 3–20 letters, numbers or _.');return}if(users.some(x=>x.id!=='me'&&x.username===u)){toast('Username already taken.');return}if(!d){toast('Display name cannot be empty.');return}profile={...profile,username:u,name:d,emoji:document.querySelector('[data-emoji].sel')?.textContent||profile.emoji};users=users.map(x=>x.id==='me'?profile:x);save();$('modalbg').classList.remove('show');render();toast('Profile updated.');return}if(e.target.id==='saveNiche'){let name=$('nname').value.trim().replace(/^#/,'');if(!/^[a-zA-Z0-9 _-]{2,30}$/.test(name)){toast('Enter a valid niche name.');return}let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-');if(niches.some(x=>x.id===id)){toast('That niche already exists.');return}let emoji=document.querySelector('[data-nemoji].sel')?.textContent||'🌐';niches.push({id,name,emoji,followers:0});save();$('modalbg').classList.remove('show');nav('niche',{niche:id});return}let dm=e.target.closest('[data-delmsg]');if(dm){if(confirm('Delete this message?')){messages=messages.filter(x=>x.id!==dm.dataset.delmsg);save();render()}}});

document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();let v=$('chatInput').value.trim();if(!v)return;if(badText(v)){toast('This message contains bad language. Please remove it.');return}messages.push({id:'m'+Date.now(),from:'me',to:s.chat,text:v,created:Date.now(),read:false});save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='homeSearch'||e.target.id==='exploreSearch'){s.search=e.target.value;render();let x=$(e.target.id);if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}}if(e.target.id==='peopleSearch'){let q=e.target.value.toLowerCase();$('peopleResults').innerHTML=users.filter(u=>u.id!=='me'&&(u.name+' '+u.username).toLowerCase().includes(q)).map(u=>`<div class="row" data-chat="${u.id}"><div class="avatar">${u.emoji}</div><div><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)}</div></div></div>`).join('')}});
function toggleFollow(id){if(followed.includes(id)){followed=followed.filter(x=>x!==id);toast('Unfollowed niche.')}else{followed.push(id);toast('Following niche.')}let n=niche(id);if(n)n.followers+=followed.includes(id)?1:-1;save();render()}
render();
</script></body></html>
